<title>Life</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0613;
  --panel: #150f27;
  --panel2: #1d1535;
  --line: rgba(167, 139, 250, .14);
  --text: #eee9fb;
  --muted: #8e86ab;
  --p1: #a855f7;
  --p2: #7c3aed;
  --p3: #5b21b6;
  --green: #34d399;
  --red: #fb7185;
  --amber: #fbbf24;
  --radius: 16px;
  --ease: cubic-bezier(.22, .8, .3, 1);
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(900px 520px at 88% -10%, rgba(124, 58, 237, .28), transparent 60%),
    radial-gradient(700px 520px at -8% 108%, rgba(168, 85, 247, .18), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.ico { display: block; flex: none; }

.bg-glow {
  position: fixed; inset: -20%; z-index: 0; pointer-events: none;
  background: radial-gradient(40% 40% at 30% 30%, rgba(168, 85, 247, .12), transparent 70%),
              radial-gradient(35% 35% at 75% 70%, rgba(99, 102, 241, .10), transparent 70%);
  animation: drift 22s ease-in-out infinite alternate;
}

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; position: relative; z-index: 1; }
.sidebar {
  display: flex; flex-direction: column; padding: 20px 16px 18px; min-height: 0;
  background: linear-gradient(180deg, rgba(21, 15, 39, .94), rgba(12, 8, 24, .94));
  border-right: 1px solid var(--line);
  backdrop-filter: blur(16px);
}
.brand { display: block; padding: 0 6px 20px; }
.logo { width: 156px; height: auto; display: block; filter: drop-shadow(0 0 12px rgba(168, 85, 247, .65)); animation: glowPulse 4s ease-in-out infinite; }
.slogan { display: block; margin-top: 4px; text-align: center; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

#nav { position: relative; display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; }
.nav-link {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; border-radius: 12px; color: var(--muted); font-weight: 600;
  transition: color .2s, transform .25s var(--ease);
}
.nav-link:hover { color: var(--text); transform: translateX(4px); }
.nav-link.active { color: #fff; }
.nav-link .nav-badge { margin-left: auto; background: var(--p2); color: #fff; font-size: 11px; padding: 1px 8px; border-radius: 10px; }
.nav-ind {
  position: absolute; left: 0; right: 0; top: 0; height: 44px; border-radius: 12px; opacity: 0;
  background: linear-gradient(90deg, #6d28d9, #4c1d95);
  box-shadow: 0 8px 26px rgba(109, 40, 217, .5), inset 0 1px 0 rgba(255, 255, 255, .18);
  transition: transform .4s var(--ease), height .4s var(--ease), opacity .25s;
}
.nav-ind.on { opacity: 1; }
.nav-spacer { flex: 1; }

#mini-dl { display: none; margin-bottom: 8px; }
#mini-dl.on { display: block; animation: fadeUp .4s var(--ease) both; }
.mini-card { display: grid; gap: 6px; padding: 12px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; }
.mini-t { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-s { color: var(--muted); font-size: 12px; }

.content { overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; min-width: 0; min-height: 0; }
.content::-webkit-scrollbar { width: 10px; }
.content::-webkit-scrollbar-thumb { background: #2a1f4a; border-radius: 6px; border: 2px solid var(--bg); }

.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px;
  padding: 14px 32px; background: rgba(10, 6, 19, .72); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.search {
  flex: 1; max-width: 520px; min-width: 0; display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; color: var(--muted);
  transition: border-color .25s, box-shadow .25s;
}
.search:focus-within { border-color: var(--p2); box-shadow: 0 0 0 4px rgba(124, 58, 237, .22); color: var(--text); }
.search input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; padding: 11px 0; outline: none; min-width: 0; }
.proto-pill { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--amber); border: 1px solid rgba(251, 191, 36, .35); padding: 4px 10px; border-radius: 20px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.icon-btn {
  position: relative; width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  transition: color .2s, transform .2s var(--ease), border-color .2s, background .2s;
}
.icon-btn:hover { color: var(--text); transform: translateY(-2px); border-color: rgba(167, 139, 250, .4); }
.icon-btn.heart.on { color: #f472b6; border-color: rgba(244, 114, 182, .5); background: rgba(244, 114, 182, .12); }
.icon-btn.heart.on svg { fill: currentColor; }
.icon-btn.pop { animation: pop .45s var(--ease); }
.bell-dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px var(--panel); animation: pulse 1.8s infinite; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff; font-size: 11px; box-shadow: 0 0 0 3px var(--bg); animation: pop .4s var(--ease); }
.profile { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 14px; border: 1px solid transparent; transition: background .2s, border-color .2s; }
.profile:hover { background: var(--panel); border-color: var(--line); }
.profile .pname { font-weight: 700; font-size: 14px; line-height: 1.1; }
.profile .pstat { font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 6px; }
.profile .pstat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

.notes-wrap { position: relative; }
.notes { position: absolute; right: 0; top: 52px; width: 330px; max-width: calc(100vw - 32px); max-height: 380px; overflow: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 24px 60px rgba(0, 0, 0, .6); transform-origin: top right; }
.notes:not([hidden]) { animation: dropIn .28s var(--ease); }
.notes h4 { padding: 8px 10px; font-size: 13px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.note { padding: 10px; border-radius: 10px; font-size: 14px; display: grid; gap: 2px; }
.note:hover { background: rgba(124, 58, 237, .14); }
.note small { color: var(--muted); }
.notes .none { padding: 18px 10px; color: var(--muted); text-align: center; }

.view { padding: 28px 32px 70px; max-width: 1280px; margin: 0 auto; }
.view-enter .reveal { animation: fadeUp .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }

h1 { font-size: 30px; letter-spacing: -.3px; }
h2 { font-size: 20px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 34px 0 14px; }
.section-head a { color: var(--p1); font-size: 14px; font-weight: 600; transition: transform .2s var(--ease); }
.section-head a:hover { transform: translateX(4px); }
.muted { color: var(--muted); }

/* ---------- botões ---------- */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 11px 22px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--p1), var(--p2) 60%, var(--p3));
  background-size: 160% 100%; background-position: 0 0;
  box-shadow: 0 10px 26px rgba(124, 58, 237, .38);
  transition: transform .2s var(--ease), box-shadow .25s, background-position .4s var(--ease), filter .2s;
}
.btn:hover { transform: translateY(-2px); background-position: 100% 0; box-shadow: 0 14px 34px rgba(124, 58, 237, .55); }
.btn:active { transform: translateY(0) scale(.97); }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .nav-link:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 2px; }
.btn.lg { padding: 14px 30px; font-size: 16px; }
.btn.ghost { background: var(--panel2); box-shadow: none; border: 1px solid var(--line); color: var(--text); }
.btn.ghost:hover { border-color: rgba(167, 139, 250, .45); box-shadow: none; }
.btn.green { background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 10px 26px rgba(16, 185, 129, .3); }
.btn.sm { padding: 8px 16px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .45); transform: scale(0); animation: ripple .65s linear; pointer-events: none; }

/* ---------- arte dos jogos (sem imagens externas) ---------- */
.art {
  position: relative; overflow: hidden; width: 100%; height: 100%;
  background:
    radial-gradient(circle at 24% 22%, rgba(255, 255, 255, .26), transparent 46%),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 14px),
    linear-gradient(135deg, var(--c1), var(--c2));
  display: grid; place-items: center; text-align: center;
}
.art::before {
  content: ""; position: absolute; inset: -30%;
  background: radial-gradient(circle at 70% 80%, rgba(0, 0, 0, .45), transparent 55%);
  animation: drift 14s ease-in-out infinite alternate;
}
.art-emoji { position: relative; font-size: 46px; line-height: 1; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .5)); animation: floaty 5s ease-in-out infinite; }
.art-title { position: absolute; left: 10px; right: 10px; bottom: 10px; font-weight: 800; font-size: 14px; text-shadow: 0 2px 10px rgba(0, 0, 0, .8); }
.art.small .art-title, .art.thumb .art-title { display: none; }
.art.thumb .art-emoji { font-size: 26px; }

/* ---------- cartões ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
.grid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer;
  transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty, 0px));
  transition: transform .25s var(--ease), box-shadow .3s, border-color .3s;
  will-change: transform; min-width: 0;
}
.card:hover { --ty: -7px; border-color: rgba(167, 139, 250, .5); box-shadow: 0 22px 50px rgba(0, 0, 0, .55), 0 0 36px rgba(124, 58, 237, .28); }
.card-art { position: relative; height: 170px; overflow: hidden; }
.card-art .art { transition: transform .6s var(--ease); }
.card:hover .card-art .art { transform: scale(1.12); }
.card-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .22) 50%, transparent 60%); transform: translateX(-120%); }
.card:hover .card-art::after { transform: translateX(120%); transition: transform .9s var(--ease); }
.card-body { padding: 12px 14px 14px; display: grid; gap: 4px; }
.card-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { color: var(--muted); font-size: 13px; }
.card-price { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.price { font-weight: 800; }
.old { color: var(--muted); text-decoration: line-through; font-size: 13px; }
.disc-badge { background: linear-gradient(135deg, #34d399, #059669); color: #04130d; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 6px; }
.disc { position: absolute; top: 10px; left: 10px; z-index: 2; background: linear-gradient(135deg, #34d399, #059669); color: #04130d; font-weight: 800; font-size: 13px; padding: 4px 9px; border-radius: 8px; box-shadow: 0 6px 16px rgba(0, 0, 0, .4); }
.tag { display: inline-block; background: rgba(124, 58, 237, .16); color: #c4b5fd; border-radius: 6px; padding: 3px 10px; font-size: 12px; margin-right: 6px; }

/* ---------- destaque (hero) ---------- */
.home-top { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; }
.hero { position: relative; height: 380px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 30px 70px rgba(0, 0, 0, .5); }
.hero-slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .8s var(--ease), visibility .8s; }
.hero-slide.on { opacity: 1; visibility: visible; }
.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 78% 35%, rgba(255, 255, 255, .22), transparent 40%),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .03) 0 2px, transparent 2px 16px),
    linear-gradient(120deg, var(--c1), var(--c2));
  transform: scale(1);
}
.hero-slide.on .hero-bg { animation: kenburns 9s ease-out both; }
.hero-slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 6, 19, .92) 5%, rgba(10, 6, 19, .35) 55%, transparent); }
.hero-emoji { position: absolute; right: 7%; top: 50%; transform: translateY(-50%); font-size: 190px; line-height: 1; z-index: 1; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .55)); }
.hero-slide.on .hero-emoji { animation: floaty 6s ease-in-out infinite, popIn .9s var(--ease) both; }
.hero-copy { position: absolute; left: 36px; bottom: 44px; z-index: 2; max-width: 52%; display: grid; gap: 10px; }
.hero-slide .hero-copy > * { opacity: 0; transform: translateX(-26px); }
.hero-slide.on .hero-copy > * { animation: slideIn .7s var(--ease) both; }
.hero-slide.on .hero-copy > *:nth-child(1) { animation-delay: .15s; }
.hero-slide.on .hero-copy > *:nth-child(2) { animation-delay: .25s; }
.hero-slide.on .hero-copy > *:nth-child(3) { animation-delay: .33s; }
.hero-slide.on .hero-copy > *:nth-child(4) { animation-delay: .41s; }
.hero-slide.on .hero-copy > *:nth-child(5) { animation-delay: .49s; }
.hero-slide.on .hero-copy > *:nth-child(6) { animation-delay: .57s; }
.pill { justify-self: start; background: linear-gradient(135deg, var(--p1), var(--p2)); font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 8px; letter-spacing: .5px; }
.hero-title { font-size: 46px; line-height: 1.02; font-weight: 900; letter-spacing: -1px; text-shadow: 0 6px 30px rgba(0, 0, 0, .6); }
.hero-meta { color: #c9c1e6; font-size: 14px; }
.hero-tag { color: #ddd6f3; max-width: 420px; }
.hero-price { display: flex; align-items: center; gap: 10px; font-size: 20px; }
.hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hero-nav { position: absolute; right: 20px; bottom: 20px; z-index: 3; display: flex; gap: 8px; }
.hero-nav .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(10, 6, 19, .6); backdrop-filter: blur(8px); }
.dots { position: absolute; left: 36px; bottom: 18px; z-index: 3; display: flex; gap: 8px; }
.dot-b { width: 26px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .22); border: 0; padding: 0; overflow: hidden; position: relative; }
.dot-b.on::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: left; animation: fill 7s linear both; }
.hero:hover .dot-b.on::after { animation-play-state: paused; }

.side-list { display: grid; grid-template-rows: repeat(3, 1fr); gap: 14px; }
.side-tile { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; transition: transform .3s var(--ease), box-shadow .3s; }
.side-tile:hover { transform: translateX(-6px) scale(1.02); box-shadow: 0 16px 40px rgba(0, 0, 0, .5), 0 0 30px rgba(124, 58, 237, .3); }
.side-tile .art { position: absolute; inset: 0; }
.side-tile .art-title { font-size: 15px; }

/* ---------- abas / chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.chip { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 6px 16px; font-size: 14px; transition: all .25s var(--ease); }
.chip:hover { color: var(--text); transform: translateY(-2px); }
.chip.on { background: linear-gradient(135deg, var(--p2), var(--p3)); color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(124, 58, 237, .4); }
select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; outline: none; }
select:focus, input:focus, textarea:focus { border-color: var(--p2); box-shadow: 0 0 0 4px rgba(124, 58, 237, .2); }

.tabs { position: relative; display: inline-flex; max-width: 100%; flex-wrap: wrap; gap: 6px; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 20px; }
.tab { position: relative; z-index: 1; background: none; border: 0; padding: 8px 18px; border-radius: 10px; color: var(--muted); font-weight: 600; transition: color .2s; }
.tab.on { color: #fff; }
.tab-ind { position: absolute; top: 5px; bottom: 5px; left: 0; width: 80px; border-radius: 10px; background: linear-gradient(135deg, var(--p2), var(--p3)); box-shadow: 0 6px 18px rgba(124, 58, 237, .45); transition: transform .35s var(--ease), width .35s var(--ease); }

/* ---------- listas ---------- */
.row {
  display: flex; align-items: center; gap: 16px; padding: 12px; margin-bottom: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  transition: transform .25s var(--ease), border-color .25s, box-shadow .25s;
}
.row:hover { transform: translateX(6px); border-color: rgba(167, 139, 250, .4); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.row .thumb { width: 96px; height: 56px; border-radius: 10px; overflow: hidden; flex: none; }
.row .grow { flex: 1; min-width: 0; }
.row .rtitle { font-weight: 700; cursor: pointer; }
.row .rtitle:hover { color: #c4b5fd; }
.row .actions { display: flex; align-items: center; gap: 8px; }
.stats { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 20px; min-width: 150px; }
.stat b { display: block; font-size: 26px; background: linear-gradient(135deg, #e9d5ff, var(--p1)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { color: var(--muted); font-size: 13px; }

.bar { display: block; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; width: 100%; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .25s linear;
  background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .22) 0 8px, transparent 8px 16px), linear-gradient(90deg, var(--p1), #60a5fa);
  background-size: 32px 32px, 100% 100%; animation: stripes 1s linear infinite; }
.dl-wrap { display: grid; gap: 4px; min-width: 240px; }
.dl-wrap small { color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }

/* ---------- jogo ---------- */
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; margin-bottom: 14px; transition: color .2s, transform .2s var(--ease); }
.back:hover { color: var(--text); transform: translateX(-4px); }
.banner { position: relative; height: 240px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); }
.banner .hero-bg { animation: kenburns 12s ease-out both; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 0%, transparent 70%); }
.banner .hero-emoji { font-size: 150px; right: 10%; animation: floaty 6s ease-in-out infinite; }
.game-head { position: relative; z-index: 2; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; margin: -90px 24px 0; align-items: end; }
.cover { height: 260px; border-radius: 16px; overflow: hidden; border: 2px solid rgba(255, 255, 255, .14); box-shadow: 0 24px 50px rgba(0, 0, 0, .6); }
.ginfo { display: grid; gap: 10px; padding-bottom: 6px; min-width: 0; }
.ginfo h1 { font-size: 36px; overflow-wrap: anywhere; }
.buyline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.buyline .price { font-size: 24px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.two-col { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; margin-top: 24px; }
.panel h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.achv { width: 46px; height: 46px; display: grid; place-items: center; font-size: 22px; border-radius: 12px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); filter: grayscale(1); opacity: .45; transition: transform .25s var(--ease); }
.achv.on { filter: none; opacity: 1; background: rgba(124, 58, 237, .22); border-color: rgba(167, 139, 250, .6); box-shadow: 0 0 22px rgba(168, 85, 247, .45); }
.achv:hover { transform: translateY(-4px) rotate(-6deg) scale(1.1); }
.friend-line { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.shot { height: 130px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); transition: transform .3s var(--ease); }
.shot:hover { transform: scale(1.05); }
.req-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.req-panel { display: none; }
.req-panel.on { display: block; animation: fadeUp .4s var(--ease) both; }
.req-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.req-row:last-child { border-bottom: 0; }
.req-row span:first-child { color: var(--muted); }

/* ---------- amigos / comunidade ---------- */
.avatar { position: relative; flex: none; width: 42px; height: 42px; border-radius: 4px; display: grid; place-items: center; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, hsl(var(--h) 70% 55%), hsl(calc(var(--h) + 40) 70% 38%)); }
.avatar.lg { width: 48px; height: 48px; }
.avatar .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--bg); background: #64748b; }
.dot.online, .dot.ingame { background: var(--green); }
.dot.ingame { animation: pulse 2s infinite; }
.dot.menu { background: #60a5fa; }
.dot.away { background: var(--amber); }
.friend { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; transition: transform .25s var(--ease), border-color .25s; }
.friend:hover { transform: translateX(6px); border-color: rgba(167, 139, 250, .4); }
.friend .fname { font-weight: 700; }
.friend .fstat { color: var(--muted); font-size: 13px; }
.friend a.fstat:hover { color: #c4b5fd; }
.post { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; display: grid; gap: 10px; transition: transform .25s var(--ease), border-color .25s; }
.post:hover { transform: translateY(-3px); border-color: rgba(167, 139, 250, .4); }
.post-head { display: flex; align-items: center; gap: 12px; }
.like { justify-self: start; display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; color: var(--muted); transition: all .25s var(--ease); }
.like:hover { color: var(--text); }
.like.on { color: #f472b6; border-color: rgba(244, 114, 182, .5); background: rgba(244, 114, 182, .1); }
.like.on svg { fill: currentColor; }
.like.pop svg { animation: pop .45s var(--ease); }

/* ---------- formulários ---------- */
form { display: grid; gap: 14px; max-width: 620px; }
label.f { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea {
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; min-width: 0;
}
textarea { min-height: 110px; resize: vertical; }
form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; }
.switch input { display: none; }
.switch .track { position: relative; flex: none; width: 52px; height: 28px; border-radius: 14px; background: #2a2146; transition: background .3s; cursor: pointer; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .3s var(--ease); }
.switch input:checked + .track { background: var(--p2); }
.switch input:checked + .track::after { transform: translateX(24px); }

.empty { color: var(--muted); padding: 60px 0; text-align: center; display: grid; gap: 14px; justify-items: center; }
.empty .big { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); animation: floaty 4s ease-in-out infinite; }
.error { color: #ff8a80; }
.total { display: flex; justify-content: flex-end; align-items: center; gap: 22px; margin-top: 20px; font-size: 20px; flex-wrap: wrap; }
.note-line { text-align: right; color: var(--muted); font-size: 13px; margin-top: 8px; }

.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 100; padding: 13px 22px; border-radius: 14px; max-width: calc(100vw - 32px);
  background: rgba(29, 21, 53, .96); border: 1px solid rgba(167, 139, 250, .4); backdrop-filter: blur(10px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .6), 0 0 30px rgba(124, 58, 237, .3);
  transform: translate(-50%, 30px); opacity: 0; pointer-events: none; transition: transform .45s var(--ease), opacity .3s;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* ---------- animações ---------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: translateY(-50%) scale(.6) rotate(-8deg); } to { opacity: 1; transform: translateY(-50%) scale(1); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes floaty { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
@keyframes drift { from { transform: translate(-3%, -2%) scale(1); } to { transform: translate(4%, 3%) scale(1.08); } }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
@keyframes glowPulse { 0%, 100% { filter: drop-shadow(0 0 10px rgba(168, 85, 247, .5)); } 50% { filter: drop-shadow(0 0 22px rgba(168, 85, 247, .95)); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .55); } 70% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }
@keyframes dropIn { from { opacity: 0; transform: scale(.92) translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes stripes { to { background-position: 32px 0, 0 0; } }

.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation: none !important; transition: none !important; }
.reduce-motion .hero-slide .hero-copy > * { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .hero-slide .hero-copy > * { opacity: 1; transform: none; }
}

/* ---------- telas menores ---------- */
@media (max-width: 1080px) {
  .home-top { grid-template-columns: minmax(0, 1fr); }
  .side-list { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 110px; }
  .grid.five { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .two-col { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 72px minmax(0, 1fr); }
  .slogan, .nav-link span:not(.nav-ico) { display: none; }
  .sidebar { padding: 16px 8px; }
  .brand { padding: 0 0 16px; }
  .logo { width: 56px; }
  .nav-link { justify-content: center; padding: 12px; }
  .nav-ind { left: 0; right: 0; }
  .topbar { padding: 12px 16px; gap: 10px; }
  .top-actions { gap: 8px; }
  .proto-pill, .profile .ptext { display: none; }
  .view { padding: 20px 16px 60px; }
  .hero-title { font-size: 32px; }
  .hero-emoji { font-size: 120px; }
  .hero-copy { max-width: 70%; left: 20px; }
  .game-head { grid-template-columns: minmax(0, 1fr); margin: -60px 8px 0; }
  .cover { height: 170px; width: 170px; }
  .grid.five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .hero { height: 460px; }
  .hero-emoji { font-size: 84px; right: 6%; top: 24%; }
  .hero-copy { max-width: calc(100% - 36px); left: 18px; bottom: 44px; }
  .hero-title { font-size: 28px; }
  .hero-tag, .hero-meta { display: none; }
  .hero-nav { display: none; }
  .dots { left: 18px; }
  .dot-b { height: 6px; }
  .side-list { grid-template-rows: 84px; gap: 8px; }
  .side-tile .art-emoji { font-size: 28px; }
  .side-tile .art-title { font-size: 11px; left: 4px; right: 4px; bottom: 6px; }

/* ---- ajuste de posição no painel dev ---- */

/* foto do destaque: esfumada nos quatro lados */
.hero-photo { position: absolute; top: 0; right: 0; height: 100%; aspect-ratio: var(--r, 16 / 9); max-width: 100%; z-index: 1; background-size: cover; background-repeat: no-repeat; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24%, #000 76%, transparent 100%), linear-gradient(180deg, transparent 0, #000 16%, #000 84%, transparent 100%);
  -webkit-mask-composite: source-in; mask-composite: intersect;
  mask-image: linear-gradient(90deg, transparent 0, #000 24%, #000 76%, transparent 100%), linear-gradient(180deg, transparent 0, #000 16%, #000 84%, transparent 100%); }

@keyframes heroPhotoIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.pos-prev.hero { width: 100%; max-width: 100%; border-radius: 8px; }
.fade { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24%, #000 76%, transparent 100%), linear-gradient(180deg, transparent 0, #000 16%, #000 84%, transparent 100%);
  -webkit-mask-composite: source-in; mask-composite: intersect;
  mask-image: linear-gradient(90deg, transparent 0, #000 24%, #000 76%, transparent 100%), linear-gradient(180deg, transparent 0, #000 16%, #000 84%, transparent 100%); }
.ratio-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }

/* ================= TEMA BURACO NEGRO ================= */
:root { --bg: #020106; --panel: #0d0919; --panel2: #151029; --line: rgba(190, 160, 255, .13); --glow: #ffb25a; }
body {
  background:
    radial-gradient(1100px 700px at 84% -12%, rgba(255, 150, 60, .10), transparent 62%),
    radial-gradient(900px 600px at 10% 112%, rgba(124, 58, 237, .20), transparent 62%),
    var(--bg);
}
.topbar { background: rgba(3, 2, 8, .66); }
.sidebar { background: linear-gradient(180deg, rgba(10, 6, 20, .86), rgba(3, 2, 8, .9)); }
.panel, .card { background: linear-gradient(160deg, rgba(20, 14, 38, .88), rgba(8, 5, 18, .92)); }

/* buraco negro de fundo */
.bh { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bh canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.bh-hole { position: absolute; right: -9vmin; bottom: -15vmin; width: 62vmin; height: 62vmin; opacity: .8; animation: bhBreath 9s ease-in-out infinite alternate; }
.bh-disc { position: absolute; left: -45%; right: -45%; top: 41%; height: 18%; border-radius: 50%; transform: rotate(-14deg);
  background: conic-gradient(from 0deg, #ffefd0, #ffb25a, #b44cff, #4c1d95, #b44cff, #ffb25a, #ffefd0);
  filter: blur(7px); opacity: .85; animation: discSpin 16s linear infinite;
  -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent 100%); mask-image: radial-gradient(closest-side, #000 30%, transparent 100%); }
.bh-core { position: absolute; inset: 24%; border-radius: 50%; background: #000; box-shadow: 0 0 0 3px rgba(255, 226, 190, .85), 0 0 40px 10px rgba(255, 150, 60, .5), 0 0 140px 50px rgba(124, 58, 237, .35); }
.bh-disc.front { clip-path: inset(50% 0 0 0); z-index: 2; }
@keyframes discSpin { to { filter: blur(7px) hue-rotate(40deg); background-position: 100% 0; } }
@keyframes bhBreath { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.06) rotate(4deg); } }

/* luz que segue o mouse */
.card, .panel, .person { position: relative; }
.card::before, .panel::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 190, 120, .16), rgba(168, 85, 247, .10) 40%, transparent 70%); }
.card:hover::before, .panel:hover::before { opacity: 1; }

/* anel de lente nos destaques */
.hero-slide::before { content: ""; position: absolute; z-index: 1; right: 4%; top: 50%; width: 360px; height: 360px; margin-top: -180px; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 0deg, transparent 0, rgba(255, 200, 130, .75) 18%, rgba(168, 85, 247, .6) 40%, transparent 62%, rgba(255, 178, 90, .5) 85%, transparent 100%);
  -webkit-mask-image: radial-gradient(circle, transparent 54%, #000 57%, #000 63%, transparent 70%); mask-image: radial-gradient(circle, transparent 54%, #000 57%, #000 63%, transparent 70%);
  filter: blur(1.5px); opacity: .7; animation: discSpinFlat 14s linear infinite; }
@keyframes discSpinFlat { to { transform: rotate(360deg); } }
.hero { box-shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 0 80px rgba(124, 58, 237, .18); }
@media (max-width: 720px) { .hero-slide::before { width: 220px; height: 220px; margin-top: -110px; right: -20px; } }

/* botões e navegação com brilho */
.btn:not(.ghost):not(.green):not(.danger) { box-shadow: 0 10px 28px rgba(124, 58, 237, .4), 0 0 0 1px rgba(255, 190, 120, .12) inset; }
.btn:not(.ghost):hover { box-shadow: 0 14px 36px rgba(124, 58, 237, .6), 0 0 22px rgba(255, 170, 90, .28); }
.nav-ind { background: linear-gradient(90deg, rgba(109, 40, 217, .95), rgba(76, 29, 149, .85)); box-shadow: 0 8px 30px rgba(109, 40, 217, .55), 0 0 22px rgba(255, 170, 90, .18), inset 0 1px 0 rgba(255, 255, 255, .2); }
h1, .section-head h2 { background: linear-gradient(90deg, #fff, #d8c8ff 60%, #ffd9a8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

/* ---------- abertura ---------- */
html.intro-on, html.intro-on body { overflow: hidden; }
#intro { cursor: grab; touch-action: none; user-select: none; position: fixed; inset: 0; z-index: 99999; background: #000; display: grid; place-items: center; overflow: hidden; transition: opacity .9s ease, visibility .9s; }
#intro.out { opacity: 0; visibility: hidden; pointer-events: none; }
#intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.in-hole { position: absolute; width: min(64vmin, 560px); aspect-ratio: 1; opacity: 0; transform: scale(.4); }
#intro.go .in-hole { animation: holeIn 1.3s var(--ease) .1s forwards; }
#intro.dock .in-hole { animation: holeDock 1.8s cubic-bezier(.65, 0, .25, 1) forwards; }
.in-spin { position: absolute; inset: 0; will-change: transform; }
.in-hint { position: absolute; z-index: 4; bottom: 11%; font-size: 12px; color: #9d90c4; opacity: 0; transition: opacity .4s; pointer-events: none; }
#intro.go .in-hint { animation: fadeIn 1s ease 2.2s forwards; }
.in-disc { position: absolute; left: -48%; right: -48%; top: 40%; height: 20%; border-radius: 50%; transform: rotate(-12deg);
  background: conic-gradient(from 0deg, #fff3d8, #ffb25a, #d46bff, #5b21b6, #d46bff, #ffb25a, #fff3d8); filter: blur(9px);
  -webkit-mask-image: radial-gradient(closest-side, #000 28%, transparent 100%); mask-image: radial-gradient(closest-side, #000 28%, transparent 100%); animation: discSpin 6s linear infinite; }
.in-disc.front { clip-path: inset(50% 0 0 0); z-index: 3; }
.in-ring { position: absolute; inset: 20%; border-radius: 50%; background: conic-gradient(from 0deg, #fff, #ffcf94, #8b3dff, #ffcf94, #fff); animation: discSpinFlat 5s linear infinite; filter: blur(2px); box-shadow: 0 0 80px 24px rgba(255, 150, 60, .5), 0 0 200px 70px rgba(124, 58, 237, .4); }
.in-core { position: absolute; inset: 22.5%; border-radius: 50%; background: #000; z-index: 1; }
.in-word { position: relative; z-index: 4; display: flex; gap: .06em; font: 900 clamp(64px, 20vmin, 200px)/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: .02em; color: #fff; text-shadow: 0 0 40px rgba(255, 190, 120, .55), 0 0 90px rgba(168, 85, 247, .6); pointer-events: none; }
.in-word span { display: inline-block; opacity: 0; --a: calc(var(--i) * 90deg + 40deg); transform: translate(calc(cos(var(--a)) * 60vmin), calc(sin(var(--a)) * 40vmin)) rotate(calc(var(--i) * 200deg + 360deg)) scale(.2); filter: blur(14px); }
#intro.go .in-word span { animation: letterIn 1.5s cubic-bezier(.2, .9, .25, 1) calc(.5s + var(--i) * .13s) forwards; }
#intro.dock .in-word { animation: wordSwallow 1s ease forwards; }
#intro.dock { background: transparent; pointer-events: none; transition: background 1.6s ease; }
#intro.dock canvas, #intro.dock .in-tag, #intro.dock .in-hint, #intro.dock .in-skip { opacity: 0; transition: opacity 1.4s; animation: none; }
.in-tag { position: absolute; z-index: 4; bottom: 16%; letter-spacing: 8px; text-transform: uppercase; font-size: 13px; color: #cdbff3; opacity: 0; pointer-events: none; }
#intro.go .in-tag { animation: fadeIn 1s ease 1.8s forwards; }
.in-skip { position: absolute; z-index: 5; right: 22px; bottom: 20px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18); color: #ddd; border-radius: 999px; padding: 6px 16px; font-size: 13px; opacity: 0; }
#intro.go .in-skip { animation: fadeIn .6s ease 1s forwards; }
@keyframes holeIn { to { opacity: 1; transform: scale(1); } }
@keyframes holeDock { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(2.2); } }
@keyframes letterIn { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 1; transform: none; filter: blur(0); } }
@keyframes wordSwallow { to { transform: scale(3); opacity: 0; filter: blur(14px); } }

/* final da abertura: glitch -> piscada branca -> some aos poucos */
#intro::before { content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .0) 0 2px, rgba(120, 220, 255, .22) 2px 3px); }
#intro::after { content: ""; position: absolute; inset: 0; z-index: 7; pointer-events: none; background: #fff; opacity: 0; }
#intro.glitch::before { opacity: 1; animation: scanShift .12s steps(2) infinite; }
#intro.glitch .in-word { animation: glitchWord .56s steps(1) forwards; }
#intro.glitch .in-hole { animation: glitchHole .56s steps(1) forwards; opacity: 1; transform: none; }
#intro.glitch canvas { animation: glitchCanvas .56s steps(1) forwards; }
#intro.flash::after { opacity: 1; transition: opacity .07s linear; }
#intro.dock::after { opacity: 0; transition: opacity 1.6s ease .1s; }
@keyframes scanShift { to { transform: translateY(3px); } }
@keyframes glitchWord {
  0% { transform: translate(0, 0); text-shadow: 6px 0 #f0f, -6px 0 #0ff; clip-path: inset(0 0 60% 0); }
  12% { transform: translate(-14px, 3px) skewX(-8deg); text-shadow: -8px 0 #f0f, 8px 0 #0ff; clip-path: inset(30% 0 20% 0); }
  25% { transform: translate(18px, -4px); text-shadow: 10px 0 #f0f, -10px 0 #0ff; clip-path: inset(0 0 0 0); }
  38% { transform: translate(-6px, 0) skewX(10deg); text-shadow: 4px 0 #f0f, -4px 0 #0ff; clip-path: inset(55% 0 5% 0); }
  52% { transform: translate(22px, 5px); text-shadow: -12px 0 #f0f, 12px 0 #0ff; clip-path: inset(10% 0 40% 0); }
  66% { transform: translate(-20px, -3px) skewX(-6deg); text-shadow: 7px 0 #f0f, -7px 0 #0ff; clip-path: inset(0 0 0 0); }
  82% { transform: translate(8px, 2px); text-shadow: -5px 0 #f0f, 5px 0 #0ff; clip-path: inset(40% 0 10% 0); }
  100% { transform: translate(0, 0); text-shadow: 3px 0 #f0f, -3px 0 #0ff; clip-path: none; }
}
@keyframes glitchHole {
  0% { transform: translate(0, 0); filter: none; } 15% { transform: translate(-16px, 4px) scale(1.02); filter: hue-rotate(90deg) saturate(2); }
  30% { transform: translate(14px, -6px); filter: invert(1); } 45% { transform: translate(-8px, 0) scale(.98); filter: hue-rotate(200deg); }
  60% { transform: translate(18px, 3px); filter: invert(1) hue-rotate(60deg); } 80% { transform: translate(-10px, -2px); filter: saturate(3); }
  100% { transform: none; filter: none; }
}
@keyframes glitchCanvas { 0%, 40%, 80% { transform: translateX(0); filter: none; } 20%, 60% { transform: translateX(12px); filter: hue-rotate(120deg) brightness(1.6); } 100% { transform: none; } }

<script>
(function () {
  var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var seen = false; try { seen = sessionStorage.getItem('life-intro') === '1'; } catch (e) {}
  var force = /[?&]intro=1/.test(location.search);
  var skip = !force && (reduce || navigator.webdriver);
  function rnd(a, b) { return a + Math.random() * (b - a); }

  /* ---------- estrelas de fundo (giram devagar em volta do buraco negro) ---------- */
  var bc = document.getElementById('bh-stars'), bx = bc && bc.getContext && bc.getContext('2d');

    var W = 0, H = 0, stars = [], raf = 0, shoot = null;

      var d = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
      bc.width = W * d; bc.height = H * d; bx.setTransform(d, 0, 0, d, 0, 0);
      var n = Math.round(Math.min(150, W * H / 9000)); stars = [];
      for (var i = 0; i < n; i++) stars.push({ a: rnd(0, 6.283), r: rnd(.05, 1.1), s: rnd(.4, 1.5), t: rnd(0, 6.283), v: rnd(.4, 1.4) });
    };
    var frame = function (now) {

      bx.clearRect(0, 0, W, H);

      for (var i = 0; i < stars.length; i++) {

        var x = cx + Math.cos(o.a) * o.r * R, y = cy + Math.sin(o.a) * o.r * R * .75;
        var al = .35 + .65 * Math.abs(Math.sin(now / 1100 * o.v + o.t));
        bx.globalAlpha = al * .85; bx.fillStyle = o.s > 1.2 ? '#ffe3bd' : '#d9ccff';

      }
      if (!shoot && Math.random() < .004) shoot = { x: rnd(0, W), y: rnd(0, H * .5), vx: rnd(6, 10), vy: rnd(2, 4), l: 0 };
      if (shoot) {
        shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.l++;
        var g = bx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 9, shoot.y - shoot.vy * 9);
        g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        bx.globalAlpha = 1; bx.strokeStyle = g; bx.lineWidth = 1.6; bx.beginPath(); bx.moveTo(shoot.x, shoot.y); bx.lineTo(shoot.x - shoot.vx * 9, shoot.y - shoot.vy * 9); bx.stroke();
        if (shoot.l > 70) shoot = null;
      }
    };

    raf = requestAnimationFrame(frame);

  }

  /* ---------- luz que segue o mouse nos cartões ---------- */
  document.addEventListener('pointermove', function (e) {
    var c = e.target && e.target.closest && e.target.closest('.card, .panel, .person');
    if (!c) return;
    var r = c.getBoundingClientRect();
    c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });

  /* ---------- abertura: LIFE puxada pelo buraco negro ---------- */
  if (!intro) return;
  if (skip) { intro.remove(); return; }
  document.documentElement.classList.add('intro-on');
  var wc = document.getElementById('intro-warp'), wx = wc.getContext('2d'), WW, HH, pts = [], t0 = performance.now(), done = false, DUR = 3600;
  var fitW = function () { WW = wc.width = innerWidth; HH = wc.height = innerHeight; };
  fitW(); addEventListener('resize', fitW);
  for (var i = 0; i < 260; i++) pts.push({ a: rnd(0, 6.283), d: rnd(.02, 1), s: rnd(.4, 1.6) });
  var loop = function (now) {
    if (done) return;
    var k = Math.min(1, (now - t0) / DUR), sp = .002 + Math.pow(k, 3) * .05;
    wx.fillStyle = 'rgba(0,0,0,.28)'; wx.fillRect(0, 0, WW, HH);
    var cx = WW / 2, cy = HH / 2, R = Math.hypot(WW, HH) / 2;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], d0 = p.d; p.d += sp * (.5 + p.d * 2.2) * p.s; if (p.d > 1) { p.d = rnd(.02, .12); p.a = rnd(0, 6.283); d0 = p.d; }
      var x0 = cx + Math.cos(p.a) * d0 * R, y0 = cy + Math.sin(p.a) * d0 * R, x1 = cx + Math.cos(p.a) * p.d * R, y1 = cy + Math.sin(p.a) * p.d * R;
      wx.strokeStyle = p.s > 1.2 ? 'rgba(255,220,180,' + (.3 + p.d) + ')' : 'rgba(210,195,255,' + (.2 + p.d) + ')';
      wx.lineWidth = .6 + p.d * 1.6; wx.beginPath(); wx.moveTo(x0, y0); wx.lineTo(x1, y1); wx.stroke();
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  var hole = document.getElementById('in-hole'), spin = document.getElementById('in-spin'), hint = intro.querySelector('.in-hint');
  var rot = 0, vel = 0, drag = false, lastA = 0, lastT = 0, touched = 0, auto = true;
  var ang = function (e) { var r = hole.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  intro.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.in-skip')) return;

    rot += d; var n = performance.now(); vel = d / Math.max(8, n - lastT) * 16; lastA = a; lastT = n; touched = n;

  });
  var up = function () { drag = false; touched = performance.now(); };
  intro.addEventListener('pointerup', up); intro.addEventListener('pointercancel', up);

    requestAnimationFrame(inertia);
  };

  var finish = function () {

        var tgt = document.querySelector('.bh-hole'), r0 = hole.getBoundingClientRect();
    if (tgt) {

      intro.style.setProperty('--dx', (r1.left + r1.width / 2 - (r0.left + r0.width / 2)) + 'px');
      intro.style.setProperty('--dy', (r1.top + r1.height / 2 - (r0.top + r0.height / 2)) + 'px');
      intro.style.setProperty('--ds', (r1.width / r0.width) + '');

  };

  var wait = setInterval(function () {
    if (done) return clearInterval(wait);
    var n = performance.now();

  }, 120);
  intro.querySelector('.in-skip').addEventListener('click', function (e) { e.stopPropagation(); clearInterval(wait); finish(); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape' || e.key === 'Enter') { clearInterval(wait); finish(); } });
})();

<script>// Lógica da loja Life, sem dependência de Node nem de navegador.
// É usada pelo servidor (server.js, com arquivos) e pela versão de
// demonstração (dentro da página, com dados em memória).
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LifeCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var PALETTES = [
    ['#0e7490', '#4338ca'],
    ['#9f1239', '#7c2d12'],
    ['#166534', '#0f766e'],
    ['#6d28d9', '#be185d'],
    ['#1d4ed8', '#0369a1'],
    ['#a16207', '#b91c1c'],
  ];
  var EMOJIS = ['🎮', '🕹️', '👾', '🚀', '🧩', '⚔️', '🌌', '🐉'];

  // Requisitos de sistema por "nível" de exigência do jogo
  var REQ = {
    1: {
      min: { cpu: 'Intel Core i3-6100 / AMD Ryzen 3 1200', ram: '4 GB', gpu: 'Intel HD 530 ou equivalente' },
      rec: { cpu: 'Intel Core i5-8400 / AMD Ryzen 5 2600', ram: '8 GB', gpu: 'GTX 1050 ou equivalente' },
    },
    2: {
      min: { cpu: 'Intel Core i5-8400 / AMD Ryzen 5 1600', ram: '8 GB', gpu: 'GTX 1050 Ti ou equivalente' },
      rec: { cpu: 'Intel Core i7-9700 / AMD Ryzen 7 3700X', ram: '16 GB', gpu: 'GTX 1660 Super ou equivalente' },
    },
    3: {
      min: { cpu: 'Intel Core i7-8700 / AMD Ryzen 5 3600', ram: '16 GB', gpu: 'GTX 1660 Ti ou equivalente' },
      rec: { cpu: 'Intel Core i7-12700 / AMD Ryzen 7 5800X', ram: '32 GB', gpu: 'RTX 3070 ou equivalente' },
    },
  };

  function slugify(text) {
    return String(text)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 50);
  }

  // Completa campos que jogos antigos ou publicados pelo portal podem não ter
  function normalizeGame(g) {
    var tier = [1, 2, 3].indexOf(g.tier) >= 0 ? g.tier : 1;
    var price = Number(g.price) || 0;
    var orig = Number(g.originalPrice) > price ? Number(g.originalPrice) : price;
    var discount = orig > price ? Math.round((1 - price / orig) * 100) : 0;
    var so = 'Windows 10 64-bit ou superior';
    var disco = Math.max(1, Math.ceil(Number(g.sizeGB) || 1)) + ' GB';
    return Object.assign({}, g, {
      tier: tier,
      price: price,
      originalPrice: orig,
      discount: discount,
      tagline: g.tagline || '',
      featured: !!g.featured,
      achievementsTotal: Number.isFinite(g.achievementsTotal) ? g.achievementsTotal : 20,
      requirements: {
        min: Object.assign({ so: so }, REQ[tier].min, { disco: disco }),
        rec: Object.assign({ so: so }, REQ[tier].rec, { disco: disco }),
      },
    });
  }

  // Os jogos de exemplo vêm sempre do seed (ficam atualizados), mas os jogos
  // publicados pelo usuário, que não estão no seed, são preservados.
  function mergeCatalog(seedGames, existing) {
    var ids = {};
    seedGames.forEach(function (g) { ids[g.id] = true; });
    return seedGames.concat((existing || []).filter(function (g) { return g && !ids[g.id]; }));
  }

  // Estado do jogador, sempre completado com os campos novos
  function normalizeState(s) {
    s = s || {};
    var lib = Array.isArray(s.library) ? s.library : [];
    return {
      library: lib
        .filter(function (e) { return e && typeof e.id === 'string'; })
        .map(function (e) {
          return {
            id: e.id,
            purchasedAt: e.purchasedAt || '',
            installed: !!e.installed,
            playMinutes: Number(e.playMinutes) || 0,
            achievementsUnlocked: Number(e.achievementsUnlocked) || 0,
          };
        }),
      favorites: Array.isArray(s.favorites) ? s.favorites.filter(function (x) { return typeof x === 'string'; }) : [],
      profile: { name: String((s.profile && s.profile.name) || 'Jogador').slice(0, 24) },
      settings: { reduceMotion: !!(s.settings && s.settings.reduceMotion) },
    };
  }

  // store = { games:{read,write}, state:{read,write}, friends:[], community:[] }
  function createRoutes(store) {
    var friends = store.friends;
    var community = store.community;
    var readGames = function () { return store.games.read().map(normalizeGame); };
    // Jogos apagados pelo desenvolvedor somem da loja, mas quem já comprou continua com eles na biblioteca.
    var shown = function (list) { return list.filter(function (g) { return !g.hidden; }); };
    var readState = function () { return normalizeState(store.state.read()); };
    var writeState = function (s) { store.state.write(s); };

    var routes = [];
    var route = function (method, pattern, handler) {
      var keys = [];
      var re = new RegExp('^' + pattern.replace(/:([a-zA-Z]+)/g, function (_, k) { keys.push(k); return '([^/]+)'; }) + '$');
      routes.push({ method: method, re: re, keys: keys, handler: handler });
    };

    // Lista de jogos: busca (?q=), gênero (?genre=) e ordem (?sort=)
    route('GET', '/api/games', function (ctx) {
      var q = String(ctx.query.get('q') || '').trim().toLowerCase();
      var genre = String(ctx.query.get('genre') || '').trim().toLowerCase();
      var sort = String(ctx.query.get('sort') || 'rating');
      var games = shown(readGames());
      if (q) {
        games = games.filter(function (g) {
          return g.title.toLowerCase().indexOf(q) >= 0 ||
            g.developer.toLowerCase().indexOf(q) >= 0 ||
            g.genres.some(function (x) { return x.toLowerCase().indexOf(q) >= 0; });
        });
      }
      if (genre) {
        games = games.filter(function (g) { return g.genres.some(function (x) { return x.toLowerCase() === genre; }); });
      }
      var sorters = {
        rating: function (a, b) { return b.rating - a.rating; },
        'price-asc': function (a, b) { return a.price - b.price; },
        'price-desc': function (a, b) { return b.price - a.price; },
        discount: function (a, b) { return b.discount - a.discount; },
        'new': function (a, b) { return String(b.releaseDate).localeCompare(String(a.releaseDate)); },
        az: function (a, b) { return a.title.localeCompare(b.title, 'pt-BR'); },
      };
      games.sort(sorters[sort] || sorters.rating);
      return [200, games];
    });

    route('GET', '/api/genres', function () {
      var set = {};
      shown(readGames()).forEach(function (g) { g.genres.forEach(function (x) { set[x] = true; }); });
      return [200, Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); })];
    });

    route('GET', '/api/games/:id', function (ctx) {
      var game = readGames().find(function (g) { return g.id === ctx.params.id; });
      if (game && game.hidden && !readState().library.some(function (e) { return e.id === game.id; })) game = null;
      if (!game) return [404, { error: 'Jogo não encontrado.' }];
      return [200, game];
    });

    // Amigos que jogam este jogo
    route('GET', '/api/games/:id/friends', function (ctx) {
      if (!readGames().some(function (g) { return g.id === ctx.params.id; })) return [404, { error: 'Jogo não encontrado.' }];
      return [200, friends.filter(function (f) { return f.game === ctx.params.id; })];
    });

    // Portal do desenvolvedor: publicar um jogo novo
    route('POST', '/api/games', function (ctx) {
      var b = ctx.body || {};
      var title = String(b.title || '').trim();
      var developer = String(b.developer || '').trim();
      var description = String(b.description || '').trim();
      var price = Number(b.price);
      var sizeGB = Number(b.sizeGB);
      var genres = String(b.genres || '')
        .split(',')
        .map(function (x) { return x.trim().slice(0, 30); })
        .filter(Boolean)
        .slice(0, 4);

      if (!title || title.length > 60) return [400, { error: 'Título é obrigatório (máx. 60 caracteres).' }];
      if (!developer || developer.length > 60) return [400, { error: 'Nome do desenvolvedor é obrigatório (máx. 60 caracteres).' }];
      if (!description || description.length > 1000) return [400, { error: 'Descrição é obrigatória (máx. 1000 caracteres).' }];
      if (!Number.isFinite(price) || price < 0 || price > 1000) return [400, { error: 'Preço deve estar entre 0 e 1000.' }];
      if (!Number.isFinite(sizeGB) || sizeGB <= 0 || sizeGB > 200) return [400, { error: 'Tamanho deve estar entre 0,1 e 200 GB.' }];
      if (genres.length === 0) return [400, { error: 'Informe pelo menos um gênero.' }];

      var games = store.games.read();
      var base = slugify(title) || 'jogo';
      var id = base;
      var n = 2;
      while (games.some(function (g) { return g.id === id; })) id = base + '-' + (n++);

      var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
      var game = {
        id: id,
        title: title,
        developer: developer,
        price: Math.round(price * 100) / 100,
        genres: genres,
        tagline: String(b.tagline || '').trim().slice(0, 100),
        description: description,
        rating: 0,
        sizeGB: Math.round(sizeGB * 10) / 10,
        releaseDate: new Date().toISOString().slice(0, 10),
        emoji: pick(EMOJIS),
        colors: pick(PALETTES),
      };
      games.push(game);
      store.games.write(games);
      return [201, normalizeGame(game)];
    });

    // Biblioteca do jogador (jogos comprados) já com os dados do jogo
    route('GET', '/api/library', function () {
      var games = readGames();
      var state = readState();
      var items = state.library
        .map(function (entry) {
          var game = games.find(function (g) { return g.id === entry.id; });
          return game ? Object.assign({}, entry, { favorite: state.favorites.indexOf(entry.id) >= 0, game: game }) : null;
        })
        .filter(Boolean);
      return [200, items];
    });

    // Compra simulada: nenhum dinheiro real, nenhum pagamento de verdade
    route('POST', '/api/purchase', function (ctx) {
      var ids = Array.isArray(ctx.body && ctx.body.ids) ? ctx.body.ids : [];
      if (ids.length === 0) return [400, { error: 'Carrinho vazio.' }];

      var games = shown(readGames());
      var state = readState();
      var unique = ids.map(String).filter(function (id, i, a) { return a.indexOf(id) === i; });

      for (var i = 0; i < unique.length; i++) {
        var id = unique[i];
        if (!games.some(function (g) { return g.id === id; })) return [400, { error: 'Jogo inexistente: ' + id }];
        if (state.library.some(function (e) { return e.id === id; })) return [400, { error: 'Você já possui um dos jogos do carrinho.' }];
      }

      var total = unique.reduce(function (sum, id) { return sum + games.find(function (g) { return g.id === id; }).price; }, 0);
      var now = new Date().toISOString();
      unique.forEach(function (id) {
        state.library.push({ id: id, purchasedAt: now, installed: false, playMinutes: 0, achievementsUnlocked: 0 });
      });
      writeState(state);
      return [201, { purchased: unique, total: Math.round(total * 100) / 100 }];
    });

    // Instalar / desinstalar (simulado: só marca o estado)
    var setInstalled = function (value) {
      return function (ctx) {
        var state = readState();
        var entry = state.library.find(function (e) { return e.id === ctx.params.id; });
        if (!entry) return [404, { error: 'Você não possui este jogo.' }];
        entry.installed = value;
        writeState(state);
        return [200, entry];
      };
    };
    route('POST', '/api/library/:id/install', setInstalled(true));
    route('DELETE', '/api/library/:id/install', setInstalled(false));

    // Sessão de jogo simulada: soma tempo de jogo e pode liberar conquistas
    route('POST', '/api/library/:id/play', function (ctx) {
      var state = readState();
      var entry = state.library.find(function (e) { return e.id === ctx.params.id; });
      if (!entry) return [404, { error: 'Você não possui este jogo.' }];
      if (!entry.installed) return [400, { error: 'Instale o jogo antes de jogar.' }];
      var game = readGames().find(function (g) { return g.id === ctx.params.id; });
      var minutes = 15 + Math.floor(Math.random() * 76);
      var before = entry.achievementsUnlocked;
      entry.playMinutes += minutes;
      entry.achievementsUnlocked = Math.min(game.achievementsTotal, before + Math.floor(Math.random() * 3));
      writeState(state);
      return [200, { minutes: minutes, newAchievements: entry.achievementsUnlocked - before, entry: entry }];
    });

    // Favoritos (serve para jogos que o jogador tem ou quer ter)
    route('GET', '/api/favorites', function () { return [200, readState().favorites]; });
    route('POST', '/api/favorites/:id', function (ctx) {
      if (!readGames().some(function (g) { return g.id === ctx.params.id; })) return [404, { error: 'Jogo não encontrado.' }];
      var state = readState();
      if (state.favorites.indexOf(ctx.params.id) < 0) state.favorites.push(ctx.params.id);
      writeState(state);
      return [200, state.favorites];
    });
    route('DELETE', '/api/favorites/:id', function (ctx) {
      var state = readState();
      state.favorites = state.favorites.filter(function (x) { return x !== ctx.params.id; });
      writeState(state);
      return [200, state.favorites];
    });

    // Amigos e comunidade (dados fictícios de exemplo)
    route('GET', '/api/friends', function () { return [200, friends]; });
    route('GET', '/api/community', function () { return [200, community]; });

    // Perfil e configurações
    route('GET', '/api/profile', function () {
      var s = readState();
      return [200, { name: s.profile.name, reduceMotion: s.settings.reduceMotion }];
    });
    route('PUT', '/api/profile', function (ctx) {
      var b = ctx.body || {};
      var state = readState();
      if (b.name !== undefined) {
        var name = String(b.name).trim();
        if (!name || name.length > 24) return [400, { error: 'O nome deve ter de 1 a 24 caracteres.' }];
        state.profile.name = name;
      }
      if (b.reduceMotion !== undefined) state.settings.reduceMotion = !!b.reduceMotion;
      writeState(state);
      return [200, { name: state.profile.name, reduceMotion: state.settings.reduceMotion }];
    });

    return routes;
  }

  // Procura a rota que atende o método e o caminho; devolve { route, params } ou null
  function match(routes, method, pathname) {
    for (var i = 0; i < routes.length; i++) {
      var r = routes[i];
      if (r.method !== method) continue;
      var m = r.re.exec(pathname);
      if (!m) continue;
      var params = {};
      r.keys.forEach(function (k, j) { params[k] = decodeURIComponent(m[j + 1]); });
      return { route: r, params: params };
    }
    return null;
  }

  return {
    normalizeGame: normalizeGame,
    normalizeState: normalizeState,
    mergeCatalog: mergeCatalog,
    createRoutes: createRoutes,
    match: match,
  };
});
</script>
<script>// Contas reais do Life com Firebase (login com e-mail/senha ou Google, nick único,
// perfil, dados guardados e pedidos de amizade). Mesma interface do social.js,
// então o app.js não muda. Precisa do Firebase (compat) carregado e de window.LIFE_FIREBASE_CONFIG.
// Sem configuração, cai no modo local (sem login e sem amigos reais).
(function () {
  'use strict';
  var PRESETS = ['aurora', 'ember', 'ocean', 'forest', 'sunset', 'midnight', 'candy', 'mono'];
  var NICK_RE = /^[A-Za-z0-9_]{3,16}$/;
  var K = { mode: 'local', fb: null, auth: null, db: null, uid: 'local', accounts: {}, out: {}, inc: {}, media: {}, local: null, devs: {}, catalog: {}, nicknames: {}, reads: {}, chats: {} };
  var clone = function (x) { return JSON.parse(JSON.stringify(x)); };
  var emit = function (evt, detail) { try { window.dispatchEvent(new CustomEvent(typeof evt === 'string' ? evt : 'life-social', { detail: detail })); } catch (e) { /* nada */ } };
  function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* só memória */ } }

  /* ------------------------------ mensagens de erro ------------------------------ */
  var AUTH_ERR = {
    'auth/email-already-in-use': 'Já existe uma conta com esse e-mail. Use "Entrar".',
    'auth/invalid-email': 'E-mail inválido.',
    'auth/weak-password': 'Senha fraca: use pelo menos 6 caracteres.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/invalid-login-credentials': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Espere um pouco e tente de novo.',
    'auth/popup-closed-by-user': 'Você fechou a janela do Google antes de terminar.',
    'auth/cancelled-popup-request': 'Você fechou a janela do Google antes de terminar.',
    'auth/popup-blocked': 'O navegador bloqueou a janela do Google. Libere pop-ups para este site.',
    'auth/network-request-failed': 'Sem conexão com a internet.',
    'auth/operation-not-allowed': 'Esse tipo de login não está ligado no Firebase (veja o LEIA-ME).',
    'auth/unauthorized-domain': 'Este endereço não está autorizado no Firebase (veja o LEIA-ME).'
  };
  var authMsg = function (e) { return AUTH_ERR[e && e.code] || ('Não foi possível entrar (' + ((e && (e.code || e.message)) || 'erro') + ').'); };

  /* -------------------------------- tela de login -------------------------------- */
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function authScreen() {
    return new Promise(function (resolve) {
      var el = document.createElement('div');
      el.className = 'welcome';
      var mode = 'login';
      function paint(msg, info) {
        el.innerHTML = '<div class="welcome-card" role="dialog" aria-label="Entrar no Life">' +
          '<img class="welcome-logo" src="' + ((document.querySelector('.logo-img') || {}).src || '') + '" alt="">' + '<h1>Entrar no <span class="grad">Life</span></h1>' +
          '<p class="muted" style="margin:0 0 10px;font-size:12.5px;color:#fbbf24">Site em desenvolvimento: ainda estamos em fase de testes.</p>' +
          '<p class="muted" style="margin:6px 0 16px">' + (mode === 'login' ? 'Entre para ver sua biblioteca, seus amigos e suas compras em qualquer navegador.' : 'Crie sua conta. Depois você escolhe seu usuário e seu nick.') + '</p>' +
          '<form id="auth-form" style="max-width:none">' +
          '<label class="f">Usuário (seu e-mail)<input type="email" name="email" autocomplete="email" placeholder="voce@exemplo.com" required></label>' +
          '<label class="f">Senha<input type="password" name="password" autocomplete="' + (mode === 'login' ? 'current-password' : 'new-password') + '" minlength="6" required></label>' +
          (mode === 'signup' ? '<label class="f">Repetir senha<input type="password" name="password2" autocomplete="new-password" minlength="6" required></label>' : '') +
          (msg ? '<p class="error">' + esc(msg) + '</p>' : '') + (info ? '<p class="muted" style="color:#6ee7b7">' + esc(info) + '</p>' : '') +
          '<div><button class="btn lg" type="submit" style="width:100%">' + (mode === 'login' ? 'Entrar' : 'Criar conta') + '</button></div>' +
          '</form>' +
          '<p class="muted" style="text-align:center;margin:16px 0 12px">ou</p>' +
          '<button type="button" class="btn ghost lg" data-a="google" style="width:100%">Entrar com Google</button>' +
          '<p class="muted" style="margin-top:14px;text-align:center">' +
          (mode === 'login'
            ? 'Não tem conta? <a href="#" data-a="signup" style="color:#c4b5fd">Criar conta</a> · <a href="#" data-a="reset" style="color:#c4b5fd">Esqueci a senha</a>'
            : 'Já tem conta? <a href="#" data-a="login" style="color:#c4b5fd">Entrar</a>') + '</p></div>';
      }
      paint();
      document.body.appendChild(el);
      var busy = false;
      function done() { el.remove(); resolve(); }
      async function run(fn) {
        if (busy) return;
        busy = true;
        try { await fn(); done(); }
        catch (e) { busy = false; var keep = el.querySelector('[name="email"]'); var v = keep ? keep.value : ''; paint(authMsg(e)); var k2 = el.querySelector('[name="email"]'); if (k2) k2.value = v; }
      }
      el.addEventListener('click', function (ev) {
        var a = ev.target.closest('[data-a]');
        if (!a) return;
        ev.preventDefault();
        var act = a.dataset.a;
        if (act === 'signup' || act === 'login') { mode = act; paint(); }
        else if (act === 'google') run(function () { return K.auth.signInWithPopup(new K.fb.auth.GoogleAuthProvider()); });
        else if (act === 'reset') {
          var email = (el.querySelector('[name="email"]') || {}).value;
          if (!email) { paint('Digite seu e-mail e clique em "Esqueci a senha" de novo.'); return; }
          K.auth.sendPasswordResetEmail(email).then(function () { paint('', 'Enviamos um e-mail para redefinir a senha (veja também o spam).'); },
            function (e) { paint(authMsg(e)); });
        }
      });
      el.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var fd = new FormData(ev.target);
        var email = String(fd.get('email')).trim(), pw = String(fd.get('password'));
        if (mode === 'signup') {
          if (pw !== String(fd.get('password2'))) { paint('As senhas não são iguais.'); var e0 = el.querySelector('[name="email"]'); if (e0) e0.value = email; return; }
          run(function () { return K.auth.createUserWithEmailAndPassword(email, pw); });
        } else run(function () { return K.auth.signInWithEmailAndPassword(email, pw); });
      });
    });
  }

  /* ------------------------------- inicialização ------------------------------- */
  function listen(query, key, pick, evt, after) {
    return new Promise(function (resolve) {
      var first = true;
      var done = function () { if (first) { first = false; resolve(); } };
      query.onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { var v = d.data() || {}; next[pick ? pick(d.id, v) : d.id] = v; });
        K[key] = next;
        if (after) { try { after(); } catch (e) { /* nada */ } }
        done(); emit(evt);
      }, function () { done(); });
      setTimeout(done, 8000);
    });
  }

  var ready = (async function init() {
    var cfg = window.LIFE_FIREBASE_CONFIG;
    var fb = window.firebase;
    var valid = cfg && fb && cfg.apiKey && String(cfg.apiKey).indexOf('COLE_AQUI') < 0;
    if (!valid) { K.local = lsGet('life-demo-account'); return; }
    try {
      if (!fb.apps.length) fb.initializeApp(cfg);
      K.fb = fb; K.auth = fb.auth(); K.db = fb.firestore();
    } catch (e) { K.local = lsGet('life-demo-account'); return; }
    var user = await new Promise(function (resolve) {
      var off = K.auth.onAuthStateChanged(function (u) { off(); resolve(u); });
    });
    if (!user) { await authScreen(); user = K.auth.currentUser; }
    if (!user) { K.local = lsGet('life-demo-account'); return; }
    K.mode = 'cloud'; K.uid = user.uid; K.email = user.email || '';
    var uid = user.uid;
    await Promise.all([
      listen(K.db.collection('users').limit(300), 'accounts'),
      listen(K.db.collection('requests').where('from', '==', uid), 'out', function (id, v) { return v.to; }, null, function () { syncChats(); }),
      listen(K.db.collection('requests').where('to', '==', uid), 'inc', function (id, v) { return v.from; }, null, function () { syncChats(); }),
      listen(K.db.collection('devs'), 'devs'),
      listen(K.db.collection('catalog'), 'catalog', null, 'life-catalog')
    ]);
    await loadMine();
  })();

  /* ----------------------------- dados privados ----------------------------- */
  function privDoc() { return K.db.doc('users/' + K.uid + '/private/life'); }
  async function loadPrivate() {
    await ready;
    if (K.mode !== 'cloud') return null;
    try { var s = await privDoc().get(); return s.exists ? s.data() : null; } catch (e) { return null; }
  }
  var pending = null, writing = false, timer = null;
  function savePrivate(obj) {
    if (K.mode !== 'cloud') return;
    pending = obj;
    clearTimeout(timer);
    timer = setTimeout(flush, 500);
  }
  async function flush() {
    if (writing || !pending) return;
    writing = true;
    var obj = pending; pending = null;
    try { await privDoc().set(Object.assign({}, obj, { updatedAt: Date.now() })); } catch (e) { pending = pending || obj; }
    writing = false;
    if (pending) { clearTimeout(timer); timer = setTimeout(flush, 1500); }
  }

  /* --------------------------------- perfil --------------------------------- */
  async function media(id, v) {
    var key = id + ':' + (v || 0);
    if (K.media[key]) return K.media[key];
    var m = { avatar: '', banner: '' };
    try {
      var s = await K.db.doc('users/' + id + '/media/main').get();
      if (s.exists) { var d = s.data(); m = { avatar: d.avatar || '', banner: d.banner || '' }; }
    } catch (e) { /* sem mídia */ }
    K.media[key] = m;
    return m;
  }

  async function fetchAccount(id) {
    if (K.accounts[id]) return K.accounts[id];
    try { var s = await K.db.doc('users/' + id).get(); if (s.exists) { K.accounts[id] = s.data(); return K.accounts[id]; } } catch (e) { /* nada */ }
    return null;
  }

  async function view(id) {
    var acc;
    if (K.mode === 'cloud') acc = await fetchAccount(id);
    else acc = id === 'local' ? K.local : null;
    if (!acc) return null;
    var m = K.mode === 'cloud' ? await media(id, acc.updatedAt) : { avatar: acc.avatar || '', banner: acc.banner || '' };
    var cloud = K.mode === 'cloud';
    return { id: id, username: cloud ? (acc.nick || '') : '', name: acc.displayName || acc.nick || acc.name || 'Jogador', bio: acc.bio || '', avatar: m.avatar, banner: m.banner, since: acc.createdAt || 0, verified: cloud && !!K.devs[id], nickname: cloud ? (K.nicknames[id] || '') : '' };
  }

  function validImage(s, max) {
    if (s === '' || s == null) return '';
    if (typeof s !== 'string') throw new Error('Imagem inválida.');
    if (s.indexOf('preset:') === 0) {
      if (PRESETS.indexOf(s.slice(7)) < 0) throw new Error('Banner inválido.');
      return s;
    }
    if (!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)) throw new Error('Formato de imagem inválido.');
    if (s.length > max) throw new Error('Imagem grande demais. Escolha outra.');
    return s;
  }

  async function putMe(body) {
    await ready;
    var cur = await view(K.uid);
    var name = body.name !== undefined ? String(body.name).trim() : (cur && cur.name);
    var username = body.username !== undefined ? String(body.username).trim() : (cur && cur.username);
    var bio = body.bio !== undefined ? String(body.bio).trim().slice(0, 160) : (cur ? cur.bio : '');
    var avatar = body.avatar !== undefined ? validImage(body.avatar, 90000) : (cur ? cur.avatar : '');
    var banner = body.banner !== undefined ? validImage(body.banner, 190000) : (cur ? cur.banner : '');
    var now = Date.now();
    if (K.mode !== 'cloud') {
      if (!name || name.length < 2 || name.length > 24) throw new Error('O nome precisa ter de 2 a 24 letras.');
      K.local = { name: name, bio: bio, avatar: avatar, banner: banner, createdAt: cur && cur.since ? cur.since : now };
      lsSet('life-demo-account', K.local);
      emit();
      return me();
    }
    if (!NICK_RE.test(username || '')) throw new Error('O usuário precisa ter de 3 a 16 caracteres: só letras (sem acento), números e _.');
    if (!name) name = username;
    if (name.length < 2 || name.length > 24) throw new Error('O nick precisa ter de 2 a 24 caracteres.');
    var lower = username.toLowerCase();
    var old = K.accounts[K.uid];
    var oldLower = old && old.nickLower;
    var mediaChanged = !cur || avatar !== cur.avatar || banner !== cur.banner;
    var updatedAt = mediaChanged ? now : ((old || {}).updatedAt || now);
    var created = old && old.createdAt ? old.createdAt : now;
    var userDoc = { nick: username, nickLower: lower, displayName: name, bio: bio, createdAt: created, updatedAt: updatedAt };
    var uid = K.uid, db = K.db;
    try {
      await db.runTransaction(async function (tx) {
        var ref = db.doc('nicks/' + lower);
        var snap = await tx.get(ref);
        if (snap.exists && (snap.data() || {}).uid !== uid) { var e = new Error('Esse usuário já está em uso. Escolha outro.'); e.nick = true; throw e; }
        if (!snap.exists) tx.set(ref, { uid: uid });
        if (oldLower && oldLower !== lower) tx.delete(db.doc('nicks/' + oldLower));
        tx.set(db.doc('users/' + uid), userDoc);
      });
    } catch (e) {
      if (e && e.nick) throw e;
      var code = e && e.code;
      if (code === 'permission-denied' || code === 'aborted' || code === 'failed-precondition') throw new Error('Esse usuário já está em uso ou não é permitido. Escolha outro.');
      throw new Error('Não foi possível salvar. Verifique sua conexão e tente de novo.');
    }
    if (mediaChanged) await db.doc('users/' + uid + '/media/main').set({ avatar: avatar, banner: banner });
    K.accounts[uid] = userDoc;
    K.media[uid + ':' + updatedAt] = { avatar: avatar, banner: banner };
    emit();
    return me();
  }

  async function me() {
    await ready;
    var v = await view(K.uid);
    return Object.assign({ id: K.uid, mode: K.mode, email: K.email || '', registered: !!v, username: '', name: '', bio: '', avatar: '', banner: '', since: 0, verified: false }, v || {}, { dev: K.mode === 'cloud' && !!K.devs[K.uid] });
  }

  /* --------------------------------- amizades -------------------------------- */
  function relation(other) {
    var mine = K.out[other], theirs = K.inc[other];
    if ((mine && mine.status === 'accepted') || (theirs && theirs.status === 'accepted')) return 'friend';
    if (theirs && theirs.status === 'pending') return 'incoming';
    if (mine && mine.status === 'pending') return 'outgoing';
    return 'none';
  }
  function since(other) { return Math.max((K.out[other] || {}).createdAt || 0, (K.inc[other] || {}).createdAt || 0); }

  async function social() {
    await ready;
    var out = { mode: K.mode, friends: [], incoming: [], outgoing: [], people: [], unread: 0 };
    if (K.mode !== 'cloud') return out;
    var ids = Object.keys(K.accounts).filter(function (id) { return id !== K.uid; });
    // quem tem pedido comigo mas não está na lista carregada (mais de 300 contas)
    Object.keys(K.out).concat(Object.keys(K.inc)).forEach(function (id) { if (ids.indexOf(id) < 0 && id !== K.uid) ids.push(id); });
    var list = await Promise.all(ids.map(async function (id) {
      var v = await view(id);
      if (v) { v.relation = relation(id); v.at = since(id); v.unread = v.relation === 'friend' ? unread(id) : 0; }
      return v;
    }));
    list.filter(Boolean).sort(function (a, b) { return a.name.localeCompare(b.name, 'pt-BR'); }).forEach(function (p) {
      p.banner = p.banner && p.banner.indexOf('preset:') === 0 ? p.banner : '';
      if (p.relation === 'friend') { out.friends.push(p); out.unread += p.unread; }
      else if (p.relation === 'incoming') out.incoming.push(p);
      else if (p.relation === 'outgoing') out.outgoing.push(p);
      out.people.push(p);
    });
    return out;
  }

  async function person(id) {
    await ready;
    var v = await view(id);
    if (!v) return null;
    v.relation = id === K.uid ? 'self' : relation(id);
    v.unread = v.relation === 'friend' ? unread(id) : 0;
    return v;
  }

  function needCloud() {
    if (K.mode !== 'cloud') throw new Error('Pedidos de amizade só funcionam com login (versão online configurada).');
  }
  async function need(id) {

  }
  var rid = function (from, to) { return from + '_' + to; };

  async function request(id) {
    await ready; await need(id);
