    if (r === 'friend') throw new Error('Vocês já são amigos.');
    if (r === 'outgoing') throw new Error('Você já enviou um pedido para essa pessoa.');
    if (r === 'incoming') return accept(id);
    await K.db.doc('requests/' + rid(K.uid, id)).set({ from: K.uid, to: id, status: 'pending', createdAt: Date.now() });
    emit();
    return { ok: true };
  }
  async function accept(id) {
    await ready; await need(id);

    await K.db.doc('requests/' + rid(id, K.uid)).update({ status: 'accepted' });
    emit();
    return { ok: true };
  }
  async function decline(id) {
    await ready; await need(id);
    if (K.inc[id]) await K.db.doc('requests/' + rid(id, K.uid)).delete();
    emit();
    return { ok: true };
  }
  async function cancel(id) {
    await ready; await need(id);

    emit();
    return { ok: true };
  }
  async function unfriend(id) {
    await ready; await need(id);
    if (K.out[id]) await K.db.doc('requests/' + rid(K.uid, id)).delete();
    if (K.inc[id]) await K.db.doc('requests/' + rid(id, K.uid)).delete();
    emit();
    return { ok: true };
  }

  /* ---------------------------- modo desenvolvedor ---------------------------- */
  // A senha NÃO está neste arquivo: quem confere é a regra do Firestore (veja firestore.rules).
  // A página só tenta gravar "devAuth" + "devs" juntos; se a senha estiver errada o banco recusa tudo.
  async function devUnlock(code) {
    await ready; needCloud();
    if (K.devs[K.uid]) return me();
    code = String(code || '');
    if (!code || code.length > 80) throw new Error('Digite a senha.');
    var db = K.db, uid = K.uid, b = db.batch();
    b.set(db.doc('devAuth/' + uid), { code: code });
    b.set(db.doc('devs/' + uid), { since: Date.now() });
    try { await b.commit(); }
    catch (e) {
      if (e && e.code === 'permission-denied') throw new Error('Senha incorreta (ou as regras do Firebase ainda não foram atualizadas).');
      throw new Error('Não foi possível verificar. Verifique sua conexão e tente de novo.');
    }
    try { await db.doc('devAuth/' + uid).delete(); } catch (e) { /* nada */ }
    K.devs[uid] = { since: Date.now() };
    emit(); emit('life-catalog');
    return me();
  }
  async function devOff() {
    await ready; needCloud();
    try { await K.db.doc('devs/' + K.uid).delete(); } catch (e) { throw new Error('Não foi possível desativar agora.'); }
    delete K.devs[K.uid];
    emit(); emit('life-catalog');
    return me();
  }
  function needDev() {
    needCloud();
    if (!K.devs[K.uid]) throw new Error('Ative o modo desenvolvedor primeiro.');
  }
  var GID_RE = /^[a-z0-9-]{1,50}$/;
  var IMG_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
  var COVER_MAX = 60000, LOGO_MAX = 45000, HERO_MAX = 80000, BANNER_MAX = 180000, SHOT_MAX = 125000, SHOTS_MAX = 6;
  var EMOJIS = ['🎮', '🕹️', '🚀', '🐉', '⚔️', '🏰', '🌌', '🧩', '🏁', '🦊', '🌋', '🛸', '🎯', '🧙'];
  var PALETTES = [['#0e7490', '#7c3aed'], ['#b91c1c', '#7c2d12'], ['#166534', '#0f766e'], ['#1e3a8a', '#0b1020'], ['#be185d', '#312e81'], ['#a16207', '#365314'], ['#4338ca', '#a21caf'], ['#c2410c', '#4c1d95']];
  var pickOf = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  function trailerOk(t) {
    t = String(t || '').trim();
    if (!t) return '';
    if (t.length > 300) throw new Error('O link do trailer é grande demais.');
    var yt = /^https:\/\/(www\.|m\.)?(youtube\.com\/(watch\?(.*&)?v=|shorts\/|embed\/)|youtu\.be\/)[A-Za-z0-9_-]{11}([&?#/].*)?$/;
    var file = /^(https:\/\/[^\s"'<>]+|[A-Za-z0-9_\-][A-Za-z0-9_\-./]*)\.(mp4|webm)$/i;
    if (!yt.test(t) && !(file.test(t) && t.indexOf('..') < 0)) throw new Error('Trailer: use um link do YouTube, ou um arquivo .mp4/.webm (link https:// ou caminho do arquivo no site).');
    return t;
  }
  function priceOf(body) {
    var price = Number(body.price), orig = Number(body.originalPrice);
    if (!isFinite(price) || price < 0 || price > 1000) throw new Error('Preço inválido (de 0 a 1000).');
    if (!isFinite(orig)) orig = price;
    if (orig < price) orig = price;
    if (orig > 1000) throw new Error('Preço original inválido (de 0 a 1000).');
    return [Math.round(price * 100) / 100, Math.round(orig * 100) / 100];
  }
  async function catalogSave(id, doc) {
    try { await K.db.doc('catalog/' + id).set(doc); }
    catch (e) { throw new Error('O banco recusou a alteração. Confira se as regras do Firebase foram atualizadas.'); }
    K.catalog[id] = doc;
    emit('life-catalog');
    return { ok: true, id: id };
  }
  async function catalogPut(id, body) {
    await ready; needDev();
    if (!GID_RE.test(id)) throw new Error('Jogo inválido.');
    var cur = Object.assign({}, K.catalog[id] || {});
    var title = body.title !== undefined ? String(body.title == null ? '' : body.title).trim() : cur.title;
    if (!title || title.length > 60) throw new Error('O nome precisa ter de 1 a 60 letras.');
    var pr = priceOf({ price: body.price !== undefined ? body.price : cur.price, originalPrice: body.originalPrice !== undefined ? body.originalPrice : cur.originalPrice });
    var doc = Object.assign(cur, { title: title, price: pr[0], originalPrice: pr[1], updatedBy: K.uid, updatedAt: Date.now() });
    if (body.cover !== undefined) {
      if (!body.cover) delete doc.cover;
      else if (!IMG_RE.test(body.cover) || body.cover.length > COVER_MAX) throw new Error('Foto inválida ou grande demais.');
      else doc.cover = body.cover;
    }
    if (body.logo !== undefined) {
      if (!body.logo) delete doc.logo;
      else if (!IMG_RE.test(body.logo) || body.logo.length > LOGO_MAX) throw new Error('Logo inválida ou grande demais.');
      else doc.logo = body.logo;
    }
    if (body.hero !== undefined) {
      if (!body.hero) { delete doc.hero; delete doc.heroRatio; delete doc.heroX; delete doc.heroY; }
      else {
        if (!IMG_RE.test(body.hero) || body.hero.length > HERO_MAX) throw new Error('Foto do destaque inválida ou grande demais.');
        if (['1:1', '4:3', '16:9', '21:9'].indexOf(body.heroRatio) < 0) throw new Error('Proporção inválida.');
        var hx = Math.round(Number(body.heroX)), hy = Math.round(Number(body.heroY));
        if (!(hx >= 0 && hx <= 100 && hy >= 0 && hy <= 100)) throw new Error('Posição inválida.');
        doc.hero = body.hero; doc.heroRatio = body.heroRatio; doc.heroX = hx; doc.heroY = hy;
      }
    }
    if (body.trailer !== undefined) { var t = trailerOk(body.trailer); if (t) doc.trailer = t; else delete doc.trailer; }
    if (body.deleted !== undefined) { if (body.deleted) doc.deleted = true; else delete doc.deleted; }
    return catalogSave(id, doc);
  }
  async function catalogDelete(id) {
    await ready; needDev();
    if (!GID_RE.test(id)) throw new Error('Jogo inválido.');
    var wasCustom = !!(K.catalog[id] && K.catalog[id].custom);
    try { await K.db.doc('catalog/' + id).delete(); } catch (e) { throw new Error('Não foi possível restaurar agora.'); }
    if (wasCustom) {
      try { await K.db.doc('gameMedia/' + id).delete(); } catch (e) { /* sem fotos */ }
      try { await K.db.doc('gameBanner/' + id).delete(); } catch (e) { /* sem banner */ }
    }
    delete K.catalog[id];
    emit('life-catalog');
    return { ok: true };
  }
  // Jogo novo, criado só por desenvolvedor; vale para todo mundo.
  async function catalogNew(body) {
    await ready; needDev();
    var title = String(body.title || '').trim(), developer = String(body.developer || '').trim(), description = String(body.description || '').trim();
    var sizeGB = Number(body.sizeGB);
    var genres = String(body.genres || '').split(',').map(function (x) { return x.trim().slice(0, 30); }).filter(Boolean).slice(0, 4);
    if (!title || title.length > 60) throw new Error('Título é obrigatório (máx. 60 caracteres).');
    if (!developer || developer.length > 60) throw new Error('Nome do desenvolvedor é obrigatório (máx. 60 caracteres).');
    if (!description || description.length > 1000) throw new Error('Descrição é obrigatória (máx. 1000 caracteres).');
    if (!isFinite(sizeGB) || sizeGB <= 0 || sizeGB > 200) throw new Error('Tamanho deve estar entre 0,1 e 200 GB.');
    if (!genres.length) throw new Error('Informe pelo menos um gênero.');
    var pr = priceOf({ price: body.price });
    var slug = title.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 36) || 'jogo';
    var id = slug + '-' + Math.random().toString(36).slice(2, 6);
    var doc = {
      title: title, price: pr[0], originalPrice: pr[0], updatedBy: K.uid, updatedAt: Date.now(), custom: true,
      developer: developer, genres: genres, tagline: String(body.tagline || '').trim().slice(0, 120), description: description,
      emoji: pickOf(EMOJIS), colors: pickOf(PALETTES), sizeGB: Math.round(sizeGB * 10) / 10, releaseDate: new Date().toISOString().slice(0, 10)
    };
    if (body.cover) { if (!IMG_RE.test(body.cover) || body.cover.length > COVER_MAX) throw new Error('Foto inválida ou grande demais.'); doc.cover = body.cover; }
    var t = trailerOk(body.trailer); if (t) doc.trailer = t;
    await catalogSave(id, doc);
    return { id: id, title: title };
  }
  // Fotos da galeria do jogo (até 6), guardadas à parte para não pesar na lista da loja.
  async function mediaGet(id) {
    await ready; needCloud();
    if (!GID_RE.test(id)) return { shots: [] };
    try {
      var s = await K.db.doc('gameMedia/' + id).get();
      var shots = s.exists ? ((s.data() || {}).shots || []) : [];
      return { shots: shots.filter(function (x) { return typeof x === 'string' && IMG_RE.test(x); }).slice(0, SHOTS_MAX) };
    } catch (e) { return { shots: [] }; }
  }
  async function mediaPut(id, shots) {
    await ready; needDev();
    if (!GID_RE.test(id)) throw new Error('Jogo inválido.');
    if (!Array.isArray(shots) || shots.length > SHOTS_MAX) throw new Error('No máximo ' + SHOTS_MAX + ' fotos.');
    var total = 0;
    shots.forEach(function (x) { if (typeof x !== 'string' || !IMG_RE.test(x) || x.length > SHOT_MAX) throw new Error('Alguma foto é inválida ou grande demais.'); total += x.length; });
    if (total > 800000) throw new Error('As fotos somam grande demais. Use menos fotos ou fotos menores.');
    try { await K.db.doc('gameMedia/' + id).set({ shots: shots, updatedBy: K.uid, updatedAt: Date.now() }); }
    catch (e) { throw new Error('O banco recusou as fotos. Confira se as regras do Firebase foram atualizadas.'); }
    emit('life-catalog');
    return { ok: true };
  }

  // Banner do jogo (imagem larga no topo da página do jogo), guardado à parte para carregar só quando preciso.
  async function bannerGet(id) {
    await ready; needCloud();
    if (!GID_RE.test(id)) return { banner: '' };
    try {
      var s = await K.db.doc('gameBanner/' + id).get();
      var b = s.exists ? (s.data() || {}).banner : '';
      return { banner: typeof b === 'string' && IMG_RE.test(b) ? b : '' };
    } catch (e) { return { banner: '' }; }
  }
  async function bannerPut(id, banner) {
    await ready; needDev();
    if (!GID_RE.test(id)) throw new Error('Jogo inválido.');
    try {
      if (!banner) await K.db.doc('gameBanner/' + id).delete();
      else {
        if (typeof banner !== 'string' || !IMG_RE.test(banner) || banner.length > BANNER_MAX) throw new Error('Banner inválido ou grande demais.');
        await K.db.doc('gameBanner/' + id).set({ banner: banner, updatedBy: K.uid, updatedAt: Date.now() });
      }
    } catch (e) {
      if (e && /Banner inválido/.test(e.message)) throw e;

    }
    emit('life-catalog');
    return { ok: true };
  }

  /* ------------------------ apelidos e mensagens ------------------------ */
  var MSG_MAX = 500;
  var chatId = function (a, b) { return a < b ? a + '_' + b : b + '_' + a; };
  var chatSubs = {};
  var nickDoc = function () { return K.db.doc('users/' + K.uid + '/private/nicks'); };
  var readDoc = function () { return K.db.doc('users/' + K.uid + '/private/reads'); };

  async function loadMine() {
    try { var a = await nickDoc().get(); if (a.exists) K.nicknames = (a.data() || {}).m || {}; } catch (e) { /* sem apelidos */ }
    try { var b = await readDoc().get(); if (b.exists) K.reads = (b.data() || {}).m || {}; } catch (e) { /* tudo não lido */ }
  }

  function friendIds() {
    var seen = {}, out = [];
    Object.keys(K.out).concat(Object.keys(K.inc)).forEach(function (id) {
      if (!seen[id]) { seen[id] = 1; if (relation(id) === 'friend') out.push(id); }
    });
    return out;
  }
  function syncChats() {
    if (K.mode !== 'cloud') return;
    var want = {};
    friendIds().forEach(function (id) { want[id] = 1; });
    Object.keys(chatSubs).forEach(function (id) {
      if (!want[id]) { try { chatSubs[id].off(); } catch (e) { /* nada */ } delete chatSubs[id]; delete K.chats[id]; }
    });
    Object.keys(want).forEach(function (id) { if (!chatSubs[id]) attachChat(id); });
  }
  function attachChat(id) {
    var sub = { seen: {}, first: true, off: function () {} };
    chatSubs[id] = sub;
    sub.off = K.db.collection('chats/' + chatId(K.uid, id) + '/messages').orderBy('createdAt', 'desc').limit(80).onSnapshot(function (snap) {
      var list = snap.docs.map(function (d) {
        var v = d.data() || {};
        return { id: d.id, from: v.from, to: v.to, text: String(v.text || ''), at: v.createdAt || 0 };
      }).sort(function (a, b) { return a.at - b.at || (a.id < b.id ? -1 : 1); });
      var incoming = [];
      list.forEach(function (m) {
        if (!sub.seen[m.id]) { sub.seen[m.id] = 1; if (!sub.first && m.from !== K.uid) incoming.push({ from: m.from, text: m.text, at: m.at }); }
      });
      sub.first = false;
      K.chats[id] = list;
      emit('life-chat', { incoming: incoming });
    }, function () { /* sem permissão ou sem conexão */ });
  }
  function unread(id) {
    var r = K.reads[id] || 0;
    return (K.chats[id] || []).filter(function (m) { return m.from !== K.uid && m.at > r; }).length;
  }

  async function needFriend(id) {

  }

    var p = await person(id);
    return { person: p, messages: (K.chats[id] || []).map(function (m) { return { id: m.id, text: m.text, at: m.at, mine: m.from === K.uid }; }) };
  }
  async function chatSend(id, text) {
    await needFriend(id);
    text = String(text == null ? '' : text).trim();
    if (!text) throw new Error('Escreva uma mensagem.');
    if (text.length > MSG_MAX) throw new Error('A mensagem pode ter no máximo ' + MSG_MAX + ' caracteres.');
    var mid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    try { await K.db.doc('chats/' + chatId(K.uid, id) + '/messages/' + mid).set({ from: K.uid, to: id, text: text, createdAt: Date.now() }); }
    catch (e) { throw new Error('Não foi possível enviar. Vocês ainda são amigos? Verifique a conexão e as regras do Firebase.'); }
    return { ok: true };
  }
  async function chatDelete(id, mid) {
    await needFriend(id);
    try { await K.db.doc('chats/' + chatId(K.uid, id) + '/messages/' + mid).delete(); }

  var readTimer = null;

    if (last > (K.reads[id] || 0)) {
      K.reads[id] = last;
      clearTimeout(readTimer);
      readTimer = setTimeout(function () { try { readDoc().set({ m: K.reads }).catch(function () { /* nada */ }); } catch (e) { /* nada */ } }, 600);

  }
  async function setNickname(id, nick) {

    try { await nickDoc().set({ m: next }); } catch (e) { throw new Error('Não foi possível salvar o apelido agora.'); }
    K.nicknames = next;
    emit();
    return { ok: true, nickname: nick };
  }

  async function signOut() {
    for (var i = 0; i < 20 && (writing || pending); i++) {
      if (writing) await new Promise(function (r) { setTimeout(r, 100); });
      else { clearTimeout(timer); await flush(); }
    }
    try { if (K.auth) await K.auth.signOut(); } catch (e) { /* nada */ }
  }

  /* ----------------------------- rotas /api/... ----------------------------- */
  function handle(method, path, body) {
    var m;
    var run = function (fn) {
      return Promise.resolve().then(fn).then(function (x) { return [200, x]; }, function (e) { return [e && e.status || 400, { error: (e && e.message) || 'Erro.' }]; });
    };
    if (path === '/api/me') {
      if (method === 'GET') return run(me);
      if (method === 'PUT') return run(function () { return putMe(body || {}); });
    }
    if (path === '/api/social' && method === 'GET') return run(social);
    if ((m = path.match(/^\/api\/chat\/([^/]+)(?:\/(read|[^/]+))?$/))) {
      var cid = decodeURIComponent(m[1]), sub = m[2];
      if (!sub && method === 'GET') return run(function () { return chatGet(cid); });
      if (!sub && method === 'POST') return run(function () { return chatSend(cid, (body || {}).text); });
      if (sub === 'read' && method === 'POST') return run(function () { return markRead(cid); });
      if (sub && sub !== 'read' && method === 'DELETE') return run(function () { return chatDelete(cid, decodeURIComponent(sub)); });
    }
    if ((m = path.match(/^\/api\/banner\/([^/]+)$/))) {
      if (method === 'GET') return run(function () { return bannerGet(decodeURIComponent(m[1])); });
      if (method === 'PUT') return run(function () { return bannerPut(decodeURIComponent(m[1]), (body || {}).banner); });
    }
    if ((m = path.match(/^\/api\/nickname\/([^/]+)$/)) && method === 'PUT') return run(function () { return setNickname(decodeURIComponent(m[1]), (body || {}).nickname); });
    if (path === '/api/dev/unlock' && method === 'POST') return run(function () { return devUnlock((body || {}).code); });
    if (path === '/api/dev' && method === 'DELETE') return run(devOff);
    if (path === '/api/games' && method === 'POST') return run(function () { return catalogNew(body || {}); });
    if (path === '/api/catalog' && method === 'POST') return run(function () { return catalogNew(body || {}); });
    if ((m = path.match(/^\/api\/media\/([^/]+)$/))) {
      if (method === 'GET') return run(function () { return mediaGet(decodeURIComponent(m[1])); });
      if (method === 'PUT') return run(function () { return mediaPut(decodeURIComponent(m[1]), (body || {}).shots); });
    }

// Lê uma imagem, recorta no tamanho pedido e devolve um texto data: (JPEG) pequeno o bastante para o banco.
function imageToDataURL(file, w, h, q, maxLen) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('Escolha um arquivo de imagem.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Não consegui ler esse arquivo.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error('Não consegui abrir essa imagem.'));
      im.onload = () => {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const x = c.getContext('2d');
        x.fillStyle = '#150f27'; x.fillRect(0, 0, w, h);
        const k = Math.max(w / im.width, h / im.height);
        x.drawImage(im, (w - im.width * k) / 2, (h - im.height * k) / 2, im.width * k, im.height * k);
        let qq = q, out = c.toDataURL('image/jpeg', qq);
        while (out.length > maxLen && qq > 0.3) { qq -= 0.1; out = c.toDataURL('image/jpeg', qq); }
        if (out.length > maxLen) return reject(new Error('Imagem grande demais. Escolha outra.'));
        resolve(out);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// Posicionar foto/banner: o recorte é feito aqui, igual ao "cover" do CSS, e o resultado pequeno é o que vai para o banco.
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('Escolha um arquivo de imagem.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Não consegui ler esse arquivo.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error('Não consegui abrir essa imagem.'));
      im.onload = () => resolve(im);
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function cropToDataURL(im, w, h, px, py, q, maxLen) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = '#150f27'; x.fillRect(0, 0, w, h);
  const k = Math.max(w / im.width, h / im.height);
  const sw = im.width * k, sh = im.height * k;
  x.drawImage(im, (w - sw) * px / 100, (h - sh) * py / 100, sw, sh);
  let qq = q, out = c.toDataURL('image/jpeg', qq);
  while (out.length > maxLen && qq > 0.3) { qq -= 0.1; out = c.toDataURL('image/jpeg', qq); }
  if (out.length > maxLen) throw new Error('Imagem grande demais. Escolha outra.');
  return out;
}
const HERO_RATIOS = { '1:1': '1 / 1', '4:3': '4 / 3', '16:9': '16 / 9', '21:9': '21 / 9' };

// Foto do destaque: guarda a imagem inteira (reduzida) e a posição/proporção ficam só como números; assim dá para ajustar depois sem enviar de novo.
function fitToDataURL(im, maxW, maxH, q, maxLen) {
  const k = Math.min(1, maxW / im.width, maxH / im.height);
  const w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = '#150f27'; x.fillRect(0, 0, w, h);
  x.drawImage(im, 0, 0, w, h);
  let qq = q, out = c.toDataURL('image/jpeg', qq);
  while (out.length > maxLen && qq > 0.3) { qq -= 0.1; out = c.toDataURL('image/jpeg', qq); }
  if (out.length > maxLen) throw new Error('Imagem grande demais. Escolha outra.');
  return out;
}

function countUp(el, to, fmt = (n) => String(Math.round(n)), dur = 900) {
  if (S.profile.reduceMotion) { el.textContent = fmt(to); return; }

}

let heroCtl = null;
function initHero(n) {
  const hero = document.getElementById('hero');
  if (!hero || n === 0) return;
  let idx = 0;
  const slides = [...hero.querySelectorAll('.hero-slide')];
  const dots = [...hero.querySelectorAll('.dot-b')];
  const show = (to) => {
    idx = ((to % n) + n) % n;
    slides.forEach((s, i) => s.classList.toggle('on', i === idx));
    dots.forEach((d, i) => {
      d.classList.remove('on');
      if (i === idx) { void d.offsetWidth; d.classList.add('on'); }
    });
  };
  let timer = every(() => { if (!hero.matches(':hover')) show(idx + 1); }, 7000);
  heroCtl = {
    go(to) {
      show(to === 'next' ? idx + 1 : to === 'prev' ? idx - 1 : Number(to));
      clearInterval(timer);
      timer = every(() => { if (!hero.matches(':hover')) show(idx + 1); }, 7000);
    },
  };
}

    return;
  }
  list.innerHTML = shown.map((e, i) => {
    const g = e.game;
    const dl = downloads.get(g.id);
    let actions;
    if (dl) {
      actions = `<div class="dl-wrap"><span class="bar"><i data-dl-bar="${esc(g.id)}" style="width:${dl.pct}%"></i></span><small><span data-dl-pct="${esc(g.id)}">${Math.round(dl.pct)}%</span><span data-dl-info="${esc(g.id)}"></span></small></div>`;
    } else if (e.installed) {
      actions = `<button class="btn" data-action="play" data-id="${esc(g.id)}">${icon('play', 16)} Jogar</button>`;
    } else {
      actions = `<button class="btn ghost" data-action="install" data-id="${esc(g.id)}">${icon('download', 16)} Instalar</button>`;
    }
    return `<div class="row reveal" style="--i:${Math.min(i, 10)}">
      <div class="thumb">${art(g, 'thumb')}</div>
      <div class="grow"><div class="rtitle" data-action="open" data-id="${esc(g.id)}">${esc(g.title)}</div>
        <div class="muted">${esc(g.sizeGB)} GB · ${e.installed ? 'Instalado' : 'Não instalado'}${e.playMinutes ? ' · ' + hours(e.playMinutes) + ' jogadas' : ''}</div></div>
      <div class="actions">${actions}
        <button class="icon-btn heart ${S.favorites.has(g.id) ? 'on' : ''}" data-action="fav" data-id="${esc(g.id)}" aria-label="Favoritar">${icon('heart')}</button></div>
    </div>`;
  }).join('');
}

/* ============== galeria do jogo (estilo Steam) ============== */
function trailerInfo(u) {
  u = String(u || '').trim();
  if (!u) return null;
  const m = u.match(/^https:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})(?:[&?#/].*)?$/);
  if (m) return { kind: 'yt', id: m[1], poster: `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` };
  if (/^(https:\/\/[^\s"'<>]+|[A-Za-z0-9_-][A-Za-z0-9_\-./]*)\.(mp4|webm)$/i.test(u) && !u.includes('..')) return { kind: 'file', src: u, poster: '' };
  return null;
}

// Imagens de amostra (desenhadas por código, sem arte de terceiros) para jogos que ainda não têm fotos.
function sampleShots(g) {
  const hex = (c, d) => (/^#[0-9a-fA-F]{6}$/.test(c || '') ? c : d);
  const c1 = hex(g.colors && g.colors[0], '#4338ca'), c2 = hex(g.colors && g.colors[1], '#a21caf');
  let h = 7;
  for (const ch of String(g.id)) h = (h * 31 + ch.charCodeAt(0)) | 0;
  const rnd = () => { h = (h * 1103515245 + 12345) & 0x7fffffff; return h / 0x7fffffff; };
  const em = String(g.emoji || '🎮').replace(/[<>&]/g, '');
  const wrap = (defs, inner) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs>${defs}</defs>${inner}` +
    '<text x="1256" y="700" text-anchor="end" font-family="sans-serif" font-size="18" fill="#fff" fill-opacity=".5">Imagem de amostra</text></svg>');
  const vgrad = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  // 1) pôr do sol e dunas
  const s1 = wrap(vgrad('a', c1, c2),
    `<rect width="1280" height="720" fill="url(#a)"/><circle cx="${700 + rnd() * 300}" cy="300" r="130" fill="#fff" fill-opacity=".85"/>
     <path d="M0 520 Q320 400 640 520 T1280 480 L1280 720 L0 720Z" fill="#000" fill-opacity=".32"/>
     <path d="M0 610 Q380 520 760 620 T1280 590 L1280 720 L0 720Z" fill="#000" fill-opacity=".55"/>
     <text x="${200 + rnd() * 300}" y="520" font-size="210" font-family="sans-serif">${em}</text>`);
  // 2) grade estilo anos 80
  let grid = '';
  for (let i = -12; i <= 12; i++) grid += `<line x1="${640 + i * 36}" y1="430" x2="${640 + i * 330}" y2="720" stroke="${c1}" stroke-opacity=".75" stroke-width="2"/>`;
  for (let k = 1; k <= 9; k++) grid += `<line x1="0" y1="${430 + Math.pow(k, 1.75) * 5.4}" x2="1280" y2="${430 + Math.pow(k, 1.75) * 5.4}" stroke="${c1}" stroke-opacity=".6" stroke-width="2"/>`;
  let bars = '';
  for (let k = 0; k < 7; k++) bars += `<rect x="440" y="${250 + k * 24}" width="400" height="${3 + k * 1.6}" fill="#0a0613"/>`;
  const s2 = wrap(vgrad('b', '#0a0613', c2) + vgrad('s', '#fbbf24', c1),
    `<rect width="1280" height="720" fill="url(#b)"/><circle cx="640" cy="330" r="190" fill="url(#s)"/>${bars}<rect y="430" width="1280" height="290" fill="#0a0613"/>${grid}`);
  // 3) montanhas à noite
  let stars = '';
  for (let k = 0; k < 70; k++) stars += `<circle cx="${rnd() * 1280}" cy="${rnd() * 380}" r="${0.8 + rnd() * 2}" fill="#fff" fill-opacity="${0.4 + rnd() * 0.6}"/>`;
  let peaks = 'M0 720 L0 520';
  for (let x = 120; x <= 1280; x += 140) peaks += ` L${x - 60} ${360 + rnd() * 120} L${x} ${520 - rnd() * 40}`;
  peaks += ' L1280 720Z';
  const s3 = wrap(vgrad('c', '#02030a', c2), `<rect width="1280" height="720" fill="url(#c)"/>${stars}<circle cx="1000" cy="150" r="64" fill="#fff" fill-opacity=".9"/><path d="${peaks}" fill="#05060f"/><path d="${peaks}" fill="${c1}" fill-opacity=".18" transform="translate(0,-12)"/><text x="${300 + rnd() * 500}" y="610" font-size="120" font-family="sans-serif">${em}</text>`);
  // 4) cidade
  let city = '';
  for (let x = 0; x < 1280; x += 70) {
    const bh = 160 + rnd() * 330;
    city += `<rect x="${x}" y="${720 - bh}" width="62" height="${bh}" fill="#0b0b1a"/>`;
    for (let y = 720 - bh + 16; y < 700; y += 26) if (rnd() > 0.55) city += `<rect x="${x + 10 + (rnd() > 0.5 ? 26 : 0)}" y="${y}" width="14" height="10" fill="#fde68a" fill-opacity=".85"/>`;
  }
  const s4 = wrap(vgrad('d', c1, c2), `<rect width="1280" height="720" fill="url(#d)"/><text x="${900 + rnd() * 160}" y="190" font-size="130" font-family="sans-serif">${em}</text>${city}`);
  // 5) tela de jogo com HUD
  const s5 = wrap(`<radialGradient id="e" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="#07040f"/></radialGradient>`,
    `<rect width="1280" height="720" fill="url(#e)"/><text x="640" y="470" text-anchor="middle" font-size="280" font-family="sans-serif">${em}</text>
     <rect x="40" y="40" width="320" height="22" rx="11" fill="#000" fill-opacity=".5"/><rect x="44" y="44" width="${180 + rnd() * 120}" height="14" rx="7" fill="#34d399"/>
     <rect x="40" y="74" width="240" height="14" rx="7" fill="#000" fill-opacity=".5"/><rect x="43" y="77" width="${100 + rnd() * 120}" height="8" rx="4" fill="#60a5fa"/>
     <circle cx="1140" cy="580" r="100" fill="#000" fill-opacity=".45" stroke="#fff" stroke-opacity=".4" stroke-width="3"/><circle cx="1140" cy="580" r="8" fill="${c2}"/>
     <g stroke="#fff" stroke-opacity=".7" stroke-width="3"><line x1="640" y1="338" x2="640" y2="362"/><line x1="640" y1="378" x2="640" y2="402"/><line x1="598" y1="370" x2="622" y2="370"/><line x1="658" y1="370" x2="682" y2="370"/></g>`);
  return [s1, s2, s3, s4, s5];
}

function galleryItems(g, shots) {
  const items = [];
  const t = trailerInfo(g.trailer);
  const imgs = shots.length ? shots : [...(g.cover && IMG_OK.test(g.cover) ? [g.cover] : []), ...sampleShots(g)];
  if (t) items.push({ type: 'video', t, poster: t.poster || imgs[0] });
  imgs.forEach((src) => items.push({ type: 'img', src }));
  return items;
}
function paintGallery() {
  const G = S.gal;
  const main = document.getElementById('g-main');
  const strip = document.getElementById('g-strip');
  if (!G || !main || !strip) return;
  const it = G.items[G.i];
  main.innerHTML = '';
  main.classList.toggle('is-video', it.type === 'video');
  const bg = document.createElement('div');
  bg.className = 'g-img';
  bg.style.backgroundImage = `url("${it.type === 'video' ? it.poster : it.src}")`;
  main.appendChild(bg);
  if (it.type === 'video') {
    const b = document.createElement('button');
    b.className = 'g-play'; b.dataset.action = 'g-play'; b.setAttribute('aria-label', 'Assistir ao trailer');
    b.innerHTML = icon('play', 34);
    main.appendChild(b);
  }
  if (!strip.children.length) {
    G.items.forEach((x, i) => {
      const b = document.createElement('button');
      b.className = 'g-th'; b.dataset.action = 'g-go'; b.dataset.i = i; b.setAttribute('aria-label', x.type === 'video' ? 'Trailer' : 'Imagem ' + (i + 1));
      b.style.backgroundImage = `url("${x.type === 'video' ? x.poster : x.src}")`;
      if (x.type === 'video') b.innerHTML = `<span class="g-th-play">${icon('play', 16)}</span>`;
      strip.appendChild(b);
    });
  }
  [...strip.children].forEach((b, i) => b.classList.toggle('on', i === G.i));
  const cnt = document.getElementById('g-count');
  if (cnt) cnt.textContent = `${G.i + 1} / ${G.items.length}`;
  const cur = strip.children[G.i];
  if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { /* nada */ } }
}
function playTrailer() {
  const G = S.gal, main = document.getElementById('g-main');
  if (!G || !main) return;
  const it = G.items[G.i];
  if (!it || it.type !== 'video') return;
  main.innerHTML = '';
  let el;
  if (it.t.kind === 'yt') {
    el = document.createElement('iframe');
    el.src = `https://www.youtube-nocookie.com/embed/${it.t.id}?autoplay=1&rel=0`;
    el.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    el.setAttribute('allowfullscreen', '');
    el.title = 'Trailer';
  } else {
    el = document.createElement('video');
    el.src = it.t.src; el.controls = true; el.autoplay = true; el.playsInline = true;
  }
  el.className = 'g-player';
  main.appendChild(el);
}

function relButtons(p) {

      ? `<button class="btn sm" data-action="chat" data-id="${id}">${icon('chat', 15)} Mensagem${p.unread ? `<b class="badge inl">${p.unread}</b>` : ''}</button>

function dlInfo(d) {
  const left = Math.max(0, (d.size * 1024 * (1 - d.pct / 100)) / d.speed);
  return `${d.speed.toFixed(0)} MB/s · ${left < 60 ? Math.ceil(left) + ' s' : Math.ceil(left / 60) + ' min'} restantes`;
}

function bindEditor(root, m, onSave) {
  const st = { avatar: m.avatar || '', banner: m.banner || '' };
  const src = { avatar: null, banner: null }; // { im, x, y } quando uma imagem nova foi escolhida
  const err = root.querySelector('[data-pe="err"]');
  const showErr = (t) => { err.textContent = t; err.hidden = !t; };
  const paint = () => {
    root.querySelector('[data-pe="banner"]').style.cssText = bannerCSS(st.banner);
    const un = root.querySelector('[name="username"]');
    root.querySelector('[data-pe="avatar"]').innerHTML = avatar(root.querySelector('[name="name"]').value.trim() || (un && un.value.trim()) || '?', '', 'xl', st.avatar);
    root.querySelectorAll('[data-pe-preset]').forEach((b) => b.classList.toggle('on', st.banner === 'preset:' + b.dataset.pePreset));
    ['avatar', 'banner'].forEach((k) => {
      const box = root.querySelector(`[data-pe="adj-${k}"]`);
      if (box) box.hidden = !src[k];
      root.querySelector(`[data-pe="${k}"]`).classList.toggle('adjustable', !!src[k]);
    });
  };
  const bake = (k) => { const s = src[k], p = PIC[k]; st[k] = cropToDataURL(s.im, p.w, p.h, s.x, s.y, p.q, p.max); };
  paint();
  root.querySelector('[name="name"]').addEventListener('input', paint);
  const unField = root.querySelector('[name="username"]');
  if (unField) unField.addEventListener('input', paint);
  root.addEventListener('change', async (ev) => {
    const f = ev.target.closest('[data-pe-file]');
    if (!f || !f.files[0]) return;
    showErr('');
    try {
      const k = f.dataset.peFile;
      src[k] = { im: await loadImageFile(f.files[0]), x: 50, y: 50 };
      root.querySelectorAll(`[data-adj="${k}"]`).forEach((r) => { r.value = 50; });
      bake(k);
      paint();
    } catch (e) { showErr(e.message); }
    f.value = '';
  });
  // barras de posição
  root.addEventListener('input', (ev) => {
    const r = ev.target.closest('[data-adj]');
    if (!r || !src[r.dataset.adj]) return;
    src[r.dataset.adj][r.dataset.axis] = Number(r.value);
    try { bake(r.dataset.adj); paint(); } catch (e) { showErr(e.message); }
  });
  // arrastar a imagem na prévia
  let drag = null;
  root.addEventListener('pointerdown', (ev) => {
    const el = ev.target.closest('[data-pe="banner"], [data-pe="avatar"]');
    if (!el) return;
    const k = el.dataset.pe;
    if (!src[k]) return;
    const rect = (k === 'avatar' ? el.querySelector('.avatar') || el : el).getBoundingClientRect();
    drag = { k, x: ev.clientX, y: ev.clientY, w: rect.width, h: rect.height };
    try { el.setPointerCapture(ev.pointerId); } catch (e) { /* ok */ }
    ev.preventDefault();
  });
  root.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const s = src[drag.k], im = s.im;
    const kk = Math.max(drag.w / im.width, drag.h / im.height);
    const rx = im.width * kk - drag.w, ry = im.height * kk - drag.h;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    drag.x = ev.clientX; drag.y = ev.clientY;
    if (rx > 1) s.x = Math.max(0, Math.min(100, s.x - (dx / rx) * 100));
    if (ry > 1) s.y = Math.max(0, Math.min(100, s.y - (dy / ry) * 100));
    root.querySelectorAll(`[data-adj="${drag.k}"]`).forEach((r) => { r.value = r.dataset.axis === 'x' ? s.x : s.y; });
    try { bake(drag.k); paint(); } catch (e) { showErr(e.message); }
  });
  const endDrag = () => { drag = null; };
  root.addEventListener('pointerup', endDrag);
  root.addEventListener('pointercancel', endDrag);
  root.addEventListener('click', (ev) => {
    const pr = ev.target.closest('[data-pe-preset]');
    if (pr) { st.banner = 'preset:' + pr.dataset.pePreset; src.banner = null; paint(); }
    if (ev.target.closest('[data-pe-clear]')) { st.avatar = ''; src.avatar = null; paint(); }
  });
  root.querySelector('.pe-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type="submit"]');
    const fd = new FormData(ev.target);
    btn.disabled = true; showErr('');
    const data = { name: fd.get('name'), bio: fd.get('bio'), avatar: st.avatar, banner: st.banner };
    if (fd.has('username')) data.username = fd.get('username');
    try { await onSave(data); }
    catch (e) { showErr(e.message); }
    btn.disabled = false;
  });
}

// Ajuste de posição (logo e banner do jogo): arraste a prévia ou use as barras; o recorte final é feito no navegador.
function paintImgEditor(row) {
  const st = row._img;
  document.querySelectorAll('[data-img-ed]').forEach((el) => { if (!st || el.dataset.imgEd !== st.kind) el.innerHTML = ''; });
  if (!st) return;
  const box = row.querySelector(`[data-img-ed="${st.kind}"]`);
  if (!box.firstChild) {
    box.innerHTML = `<div class="pos-ed"><span class="muted" style="font-size:13px">Arraste a imagem ou use as barras para escolher a posição.</span>
      ${st.kind === 'hero' ? `<div class="ratio-row"><span class="muted">Proporção:</span>${Object.keys(HERO_RATIOS).map((r) => `<button type="button" class="chip" data-action="hero-ratio" data-r="${r}">${r}</button>`).join('')}</div>` : ''}
      <div class="pos-prev ${st.kind === 'logo' ? 'sq' : st.kind === 'hero' ? 'hero fade' : 'wide'}" data-pos-prev style="background-image:url(${st.src})"></div>
      <label>Esquerda / direita<input type="range" min="0" max="100" value="${st.x}" data-pos="x"></label>
      <label>Cima / baixo<input type="range" min="0" max="100" value="${st.y}" data-pos="y"></label>
      <div style="display:flex;gap:10px"><button class="btn sm" data-action="dev-img-save">Salvar para todos</button><button class="btn ghost sm" data-action="dev-img-cancel">Cancelar</button></div></div>`;
  }
  const pv = box.querySelector('[data-pos-prev]');
  pv.style.backgroundPosition = `${st.x}% ${st.y}%`;
  if (st.kind === 'hero') {
    pv.style.aspectRatio = HERO_RATIOS[st.ratio] || '16 / 9';
    box.querySelectorAll('[data-r]').forEach((b) => b.classList.toggle('on', b.dataset.r === st.ratio));
  }
  box.querySelectorAll('[data-pos]').forEach((r) => { r.value = r.dataset.pos === 'x' ? st.x : st.y; });
}
document.addEventListener('input', (ev) => {
  const r = ev.target.closest && ev.target.closest('[data-pos]');
  if (!r) return;
  const row = r.closest('[data-row]');
  if (!row || !row._img) return;
  row._img[r.dataset.pos] = Number(r.value);
  paintImgEditor(row);
});
let imgDrag = null;
document.addEventListener('pointerdown', (ev) => {
  const pv = ev.target.closest && ev.target.closest('[data-pos-prev]');
  if (!pv) return;
  const row = pv.closest('[data-row]');
  if (!row || !row._img) return;
  const rect = pv.getBoundingClientRect();
  imgDrag = { row, x: ev.clientX, y: ev.clientY, w: rect.width, h: rect.height };
  try { pv.setPointerCapture(ev.pointerId); } catch (e) { /* ok */ }
  ev.preventDefault();
});
document.addEventListener('pointermove', (ev) => {
  if (!imgDrag) return;
  const st = imgDrag.row._img, im = st.im;
  const k = Math.max(imgDrag.w / im.width, imgDrag.h / im.height);
  const rx = im.width * k - imgDrag.w, ry = im.height * k - imgDrag.h;
  const dx = ev.clientX - imgDrag.x, dy = ev.clientY - imgDrag.y;
  imgDrag.x = ev.clientX; imgDrag.y = ev.clientY;
  if (rx > 1) st.x = Math.round(Math.max(0, Math.min(100, st.x - (dx / rx) * 100)));
  if (ry > 1) st.y = Math.round(Math.max(0, Math.min(100, st.y - (dy / ry) * 100)));
  paintImgEditor(imgDrag.row);
});
const endImgDrag = () => { imgDrag = null; };
document.addEventListener('pointerup', endImgDrag);
document.addEventListener('pointercancel', endImgDrag);
async function devSaveShots(row, shots) {
  const err = row.querySelector('[data-merr]');
  try {
    await api('/api/media/' + enc(row.dataset.row), { method: 'PUT', body: { shots } });
    toast('Fotos salvas para todos.');
    await openDevMedia(row);
  } catch (e) { if (err) { err.textContent = e.message; err.hidden = false; } else toast(e.message); }
}
document.addEventListener('change', async (ev) => {
  const row = ev.target.closest && ev.target.closest('[data-row]');
  if (!row) return;
  const files = [...(ev.target.files || [])];
  if (ev.target.matches('[data-dev-cover]') && files[0]) {
    const err = row.querySelector('[data-err]');
    err.hidden = true;
    try {
      const cover = await imageToDataURL(files[0], 480, 270, 0.78, 58000);
      await api('/api/catalog/' + enc(row.dataset.row), { method: 'PUT', body: { ...rowBody(row), cover } });
      toast('Foto trocada para todos.');
      await render({ animate: false });
    } catch (e) { err.textContent = e.message; err.hidden = false; }
    ev.target.value = '';
  } else if (ev.target.matches('[data-dev-img]') && files[0]) {
    const err = row.querySelector('[data-merr]');
    err.hidden = true;
    try {
      const im = await loadImageFile(files[0]);
      row._img = { kind: ev.target.dataset.devImg, im, src: im.src, x: 50, y: 50, ratio: '16:9', data: '' };
      paintImgEditor(row);
    } catch (e) { err.textContent = e.message; err.hidden = false; }
    ev.target.value = '';
  } else if (ev.target.matches('[data-dev-shots]') && files.length) {
    const room = 6 - (row._shots || []).length;
    const add = [];
    const err = row.querySelector('[data-merr]');
    try {
      for (const f of files.slice(0, room)) add.push(await imageToDataURL(f, 960, 540, 0.74, SHOT_MAX));
    } catch (e) { err.textContent = e.message; err.hidden = false; ev.target.value = ''; return; }
    ev.target.value = '';
    await devSaveShots(row, (row._shots || []).concat(add));
  }
});

/* ===================== mensagens, apelidos e avisos ===================== */
function askText(title, value, { max = 24, hint = '', ok = 'Salvar' } = {}) {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'welcome';
    el.innerHTML = `<div class="welcome-card" role="dialog" aria-label="${esc(title)}" style="max-width:440px">
      <h2 style="margin-bottom:6px">${esc(title)}</h2>${hint ? `<p class="muted" style="margin-bottom:12px">${esc(hint)}</p>` : ''}
      <form style="max-width:none"><label class="f"><input type="text" name="v" maxlength="${max}" autocomplete="off" value="${esc(value)}"></label>
      <div style="display:flex;gap:10px;margin-top:12px"><button class="btn" type="submit">${esc(ok)}</button><button class="btn ghost" type="button" data-x>Cancelar</button></div></form></div>`;
    document.body.appendChild(el);
    const input = el.querySelector('input');
    input.focus(); input.select();
    const close = (v) => { el.remove(); resolve(v); };
    el.querySelector('[data-x]').addEventListener('click', () => close(null));
    el.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(null); });
    el.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); close(input.value.trim()); });
  });
}

function sysNotify(title, body) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (!document.hidden && document.hasFocus()) return;
    const n = new Notification(title, { body, icon: (document.querySelector('.logo-img') || {}).src || undefined, tag: 'life-' + title });
    n.onclick = () => { window.focus(); n.close(); };
  } catch (e) { /* o navegador não deixou */ }
}

const hhmm = (t) => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const dayBR = (t) => new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
function chatLogHTML(list) {
  if (!list.length) return '<p class="muted chat-empty">Nenhuma mensagem ainda. Diga oi!</p>';
  let last = '';
  return list.map((m) => {
    const d = dayBR(m.at);
    const sep = d !== last ? `<div class="chat-day">${esc(d)}</div>` : '';
    last = d;
    return `${sep}<div class="msg ${m.mine ? 'mine' : 'theirs'}"><div class="bubble">${esc(m.text)}<small>${esc(hhmm(m.at))}${m.mine ? ` <button class="msg-x" data-action="chat-del" data-id="${esc(m.id)}" title="Apagar mensagem" aria-label="Apagar mensagem">apagar</button>` : ''}</small></div></div>`;
  }).join('');
}

/* ============================== downloads ============================== */
function renderMini() {
  const el = document.getElementById('mini-dl');
  if (!el) return;
  if (!downloads.size) { el.classList.remove('on'); el.innerHTML = ''; return; }
  const [id, d] = downloads.entries().next().value;
  el.classList.add('on');
  el.innerHTML = `<a href="#/downloads" class="mini-card"><span class="mini-t">${icon('download', 16)} ${esc(d.title)}</span><span class="bar"><i data-dl-bar="${esc(id)}" style="width:${d.pct}%"></i></span><span class="mini-s" data-dl-pct="${esc(id)}">${Math.round(d.pct)}%</span></a>`;
}

function paintDownloads() {
  downloads.forEach((d, id) => {
    document.querySelectorAll(`[data-dl-bar="${id}"]`).forEach((b) => { b.style.width = d.pct + '%'; });
    document.querySelectorAll(`[data-dl-pct="${id}"]`).forEach((b) => { b.textContent = Math.round(d.pct) + '%'; });
    document.querySelectorAll(`[data-dl-info="${id}"]`).forEach((b) => { b.textContent = dlInfo(d); });
  });
}

function startDownload(id) {
  if (downloads.has(id)) return;
  const g = gamesById.get(id);
  const size = g ? g.sizeGB : 5;
  const dur = Math.min(12, Math.max(4, 3 + size / 6)); // segundos
  const d = { pct: 0, title: g ? g.title : id, size, speed: 40 + Math.random() * 50, dur };
  downloads.set(id, d);
  renderMini();
  refreshView();
  const timer = setInterval(async () => {
    d.pct = Math.min(100, d.pct + (100 / (dur * 4)) * (0.8 + Math.random() * 0.4));
    d.speed = Math.max(20, d.speed + (Math.random() - 0.5) * 8);
    paintDownloads();
    if (d.pct < 100) return;
    clearInterval(timer);
    try { await api('/api/library/' + enc(id) + '/install', { method: 'POST' }); }
    catch (err) { toast(err.message); }
    downloads.delete(id);
    S.history.unshift({ title: d.title, size: String(d.size), at: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) });
    notify(`${d.title} foi instalado.`);
    toast(`${d.title} instalado.`);
    renderMini();
    refreshView();
  }, 250);
}

const ROUTES = {
  '': homeView, store: storeView, library: libraryView, friends: friendsView, community: communityView,
  downloads: downloadsView, cart: cartView, publish: () => publishView(), settings: settingsView, game: gameView, profile: profileView, dev: devView, chat: chatView,
};

async function render({ animate = true } = {}) {
  const parts = location.hash.replace(/^#/, '').split('/'); // "/game/abc" -> ["", "game", "abc"]
  const name = parts[1] || '';
  const arg = parts[2] ? decodeURIComponent(parts[2]) : '';
  current = { name, arg };
  renderId++;
  clearTimers();
  heroCtl = null;
  updateNav(name);
  updateBadge();
  $view.classList.toggle('view-enter', animate);
  try {
    await (ROUTES[name] || homeView)(arg);
    if (animate) $content.scrollTo({ top: 0, behavior: 'auto' });
  } catch (err) {
    $view.innerHTML = `<div class="empty error">${esc(err.message)}</div>`;
  }
}

// Atualiza a tela atual sem repetir a animação de entrada
function refreshView() {
  if (['library', 'downloads', 'game', 'cart'].includes(current.name)) return render({ animate: false });
}

}

      case 'open': location.hash = '#/game/' + enc(id); break;
      case 'back': ev.preventDefault(); if (history.length > 1) history.back(); else location.hash = '#/'; break;

        document.querySelectorAll('.req-panel').forEach((p) => p.classList.toggle('on', p.dataset.req === el.dataset.tab));
        break;
      case 'add-cart':

        saveCart();
        toast('Adicionado ao carrinho.');
        await render({ animate: false });
        break;
      case 'buy-now':
        if (!S.cart.includes(id)) S.cart.push(id);
        saveCart();
        location.hash = '#/cart';
        break;
      case 'remove-cart':
        S.cart = S.cart.filter((x) => x !== id);

        await render({ animate: false });
        break;

        saveCart();
        toast(`Compra simulada concluída (${brl(result.total)}).`);

        await render({ animate: false });

      case 'play': {

        if (r.newAchievements > 0) {

          notify(`Nova conquista em ${g ? g.title : 'um jogo'}! 🏆`);

        }
        await render({ animate: false });
        break;
      }
      case 'fav': {
        const on = !S.favorites.has(id);
        await api('/api/favorites/' + enc(id), { method: on ? 'POST' : 'DELETE' });
        if (on) S.favorites.add(id); else S.favorites.delete(id);

      case 'dev-cover-clear':
      case 'dev-delete':
      case 'dev-restore':

          } else {

        S.devOpen.add(row.dataset.row);

        break;
      }
      case 'dev-img-cancel': {

        row._img = null; paintImgEditor(row);
        break;

        const row = el.closest('[data-row]');

          row._img = { kind: 'hero', im, src: d.hero, x: d.heroX == null ? 50 : d.heroX, y: d.heroY == null ? 50 : d.heroY, ratio: d.heroRatio || '16:9', data: d.hero };

      }

        err.hidden = true;
        try {
          const clear = el.dataset.action === 'dev-img-clear';
          const kind = clear ? el.dataset.kind : row._img.kind;

          if (kind === 'hero') {
            const st = row._img;
            const heroData = clear ? '' : (st.data || fitToDataURL(st.im, 760, 430, 0.74, HERO_MAX));
            await api('/api/catalog/' + enc(gid), { method: 'PUT', body: { ...rowBody(row), hero: heroData, heroRatio: clear ? undefined : st.ratio, heroX: clear ? undefined : st.x, heroY: clear ? undefined : st.y } });

            toast(clear ? 'Removido para todos.' : 'Salvo para todos.');

          }
          if (!clear) { const st = row._img, p = PIC[kind]; value = cropToDataURL(st.im, p.w, p.h, st.x, st.y, p.q, p.max); }
          if (kind === 'logo') await api('/api/catalog/' + enc(gid), { method: 'PUT', body: { ...rowBody(row), logo: value } });
          else await api('/api/banner/' + enc(gid), { method: 'PUT', body: { banner: value } });
          row._img = null;
          toast(clear ? 'Removido para todos.' : 'Salvo para todos.');
          S.devOpen.add(gid);
          await render({ animate: false });
        } catch (e) { err.textContent = e.message; err.hidden = false; }
        break;
      }
      case 'dev-shot-del': {
        const row = el.closest('[data-row]');
        const next = (row._shots || []).filter((_, i) => i !== Number(el.dataset.i));
        await devSaveShots(row, next);
        break;

      case 'friend-tab': S.friendTab = el.dataset.tab; await render({ animate: false }); break;
      case 'req-send': await api('/api/requests', { method: 'POST', body: { to: id } }); toast('Pedido enviado.'); await render({ animate: false }); break;
      case 'req-accept': await api('/api/requests/' + enc(id) + '/accept', { method: 'POST' }); toast('Pedido aceito. Vocês agora são amigos.'); await render({ animate: false }); break;
      case 'req-decline': await api('/api/requests/' + enc(id) + '/decline', { method: 'POST' }); toast('Pedido recusado.'); await render({ animate: false }); break;
      case 'req-cancel': await api('/api/requests/' + enc(id), { method: 'DELETE' }); toast('Pedido cancelado.'); await render({ animate: false }); break;
      case 'unfriend':
        if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Confirmar?'; setTimeout(() => { el.dataset.armed = ''; el.textContent = 'Desfazer amizade'; }, 3000); break; }

        break;
      case 'demo-reset': {
        if (downloads.size) { toast('Espere os downloads terminarem para restaurar.'); break; }
        window.LIFE_DEMO.reset();
        S.cart = []; saveCart();
        S.favorites = new Set(); S.liked = new Set(); S.history = []; S.notes = []; S.unread = 0;
        document.getElementById('bell-dot').hidden = true;
        S.profile = await api('/api/profile');
        applyProfile();
        renderMini();
        toast('Dados de exemplo restaurados.');
        await render({ animate: false });
        break;
      }
    }
  } catch (err) {
    toast(err.message);
  }
});

document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.btn');
  if (!b || b.disabled || S.profile.reduceMotion) return;
  const r = b.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 2;
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(s);
  setTimeout(() => s.remove(), 700);
});

// Inclinação 3D suave nos cartões
$view.addEventListener('mousemove', (e) => {
  const c = e.target.closest('.card');
  if (!c || S.profile.reduceMotion) return;
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  c.style.setProperty('--ry', (x * 8).toFixed(2) + 'deg');
  c.style.setProperty('--rx', (-y * 8).toFixed(2) + 'deg');
});
$view.addEventListener('mouseout', (e) => {
  const c = e.target.closest('.card');
  if (c && !c.contains(e.relatedTarget)) {
    c.style.setProperty('--rx', '0deg');
    c.style.setProperty('--ry', '0deg');
  }
});

let socialTimer;
async function onSocial() {
  if (!SOCIAL || !S.me || !S.me.registered) return;
  let soc;
  try { soc = await api('/api/social'); } catch (e) { return; }
  const inc = new Set(soc.incoming.map((p) => p.id));
  const fresh = soc.incoming.filter((p) => !S.seenReq.has(p.id));
  fresh.forEach((p) => S.seenReq.add(p.id));
  if (fresh.length) {
    const t = fresh.length === 1 ? `${dname(fresh[0])} enviou um pedido de amizade.` : `${fresh.length} novos pedidos de amizade.`;
    notify(t); toast(t); sysNotify('Novo pedido de amizade', t);
  }
  soc.friends.forEach((p) => { if (S.outIds.has(p.id)) { const t = `${dname(p)} aceitou seu pedido de amizade.`; notify(t); toast(t); sysNotify('Pedido aceito', t); S.outIds.delete(p.id); } });
  soc.outgoing.forEach((p) => S.outIds.add(p.id));
  [...S.seenReq].forEach((id) => { if (!inc.has(id)) S.seenReq.delete(id); });
  updateReqBadge(soc.incoming.length + (soc.unread || 0));
  if (!S.unreadShown && soc.unread) { S.unreadShown = true; toast(soc.unread === 1 ? 'Você tem 1 mensagem não lida.' : `Você tem ${soc.unread} mensagens não lidas.`); }
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#view') && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (S.socialInit && !typing && current.name === 'friends') render({ animate: false });
  S.socialInit = true;
}

  if (!S.me || !S.me.registered) return;

  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) repaintChat(); });

document.addEventListener('submit', async (ev) => {
  if (ev.target.id !== 'dev-form') return;
  ev.preventDefault();
  const err = document.getElementById('dev-err');
  const btn = ev.target.querySelector('button[type="submit"]');
  err.hidden = true; btn.disabled = true;
  try {
    S.me = await api('/api/dev/unlock', { method: 'POST', body: { code: new FormData(ev.target).get('code') } });
    applyProfile();
    toast('Modo desenvolvedor liberado. Você ganhou o selo de verificado.');
    location.hash = '#/dev';
  } catch (e) { err.textContent = e.message; err.hidden = false; btn.disabled = false; }
});

// Quando um desenvolvedor muda nome/preço de um jogo, quem está com o site aberto vê na hora.
let catTimer;
window.addEventListener('life-catalog', () => {
  clearTimeout(catTimer);
  catTimer = setTimeout(() => {
    if (!S.me) return;
    applyProfile();
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#view') && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (typing || ['dev', 'settings', 'profile', 'friends', 'publish'].includes(current.name)) return;
    render({ animate: false });
  }, 400);
});
window.addEventListener('life-social', () => { clearTimeout(socialTimer); socialTimer = setTimeout(onSocial, 300); });

(async function boot() {
  buildChrome();
  $view.innerHTML = '<div class="empty">Carregando...</div>';
  if (window.LIFE_DEMO && window.LIFE_DEMO.ready) { try { await window.LIFE_DEMO.ready; } catch (e) { /* segue */ } }
  if (SOCIAL) {
    try { S.me = await api('/api/me'); } catch (e) { S.me = { id: 'local', mode: 'local', registered: false, name: '', bio: '', avatar: '', banner: '' }; }
    if (isCloud() && window.LIFE_DEMO) S.cart = window.LIFE_DEMO.getCart();
    if (!S.me.registered) await showWelcome();
  }
  showNotice();
  try { S.profile = await api('/api/profile'); } catch (e) { /* usa o padrão */ }
  try { S.favorites = new Set(await api('/api/favorites')); } catch (e) { /* usa o padrão */ }
  applyProfile();
  updateBadge();
  await render();
  onSocial();
})();
</script>

</body></html>
